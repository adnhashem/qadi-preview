<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الديوان — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== الديوان — داكن، مهيب، سينمائي ===== */
:root {
  color-scheme: dark;
  --bg: oklch(0.17 0.015 250);
  --bg-2: oklch(0.21 0.018 250);
  --bg-3: oklch(0.25 0.02 250);
  --line: oklch(0.32 0.02 250);
  --line-2: oklch(0.40 0.02 250);
  --fg: oklch(0.93 0.012 85);
  --fg-2: oklch(0.74 0.012 85);
  --fg-3: oklch(0.58 0.012 85);
  --accent: oklch(0.74 0.10 165);      /* زمردي مطفأ */
  --accent-2: oklch(0.62 0.10 165);
  --accent-soft: oklch(0.74 0.10 165 / .14);
  --brass: oklch(0.80 0.09 85);        /* نحاس للأرقام والعناوين */
  --warn: oklch(0.82 0.13 80);
  --ok: var(--accent);
  --font-ui: 'Tajawal', system-ui, sans-serif;
  --font-display: 'Amiri', serif;
  --r: 6px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --slow: 600ms; --mid: 320ms; --fast: 160ms;
  --head-h: 64px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: oklch(0.96 0.01 85); --bg-2: oklch(0.985 0.006 85); --bg-3: oklch(0.93 0.012 85);
  --line: oklch(0.86 0.012 85); --line-2: oklch(0.76 0.012 85);
  --fg: oklch(0.20 0.02 250); --fg-2: oklch(0.42 0.02 250); --fg-3: oklch(0.56 0.015 250);
  --accent: oklch(0.48 0.10 165); --accent-2: oklch(0.42 0.10 165); --accent-soft: oklch(0.48 0.10 165 / .12);
  --brass: oklch(0.52 0.10 70); --warn: oklch(0.55 0.13 75);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.ic { width: 20px; height: 20px; flex: none; } .ic-sm { width: 15px; height: 15px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 20; height: var(--head-h);
  display: flex; align-items: center; gap: 8px; padding: 0 32px;
  background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; margin-inline-end: 24px; }
.brand-mark { font-family: var(--font-display); font-size: 26px; color: var(--brass); line-height: 1; }
.brand-name { font-weight: 700; letter-spacing: 0; font-size: 15px; color: var(--fg-2); }
.brand-name b { display: block; color: var(--fg); font-size: 16px; }
.topnav { display: flex; gap: 2px; }
.topnav button { height: 38px; padding: 0 14px; border: 0; background: none; color: var(--fg-2); border-radius: var(--r); cursor: pointer; font-size: 15px; font-weight: 500; transition: color var(--fast), background-color var(--fast); }
.topnav button:hover { color: var(--fg); background: var(--bg-3); }
.topnav button[aria-current] { color: var(--accent); position: relative; }
.topnav button[aria-current]::after { content: ""; position: absolute; inset-inline: 14px; bottom: -13px; height: 2px; background: var(--accent); }
.top-end { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; color: var(--fg-2); border-radius: var(--r); cursor: pointer; }
.ib:hover { background: var(--bg-3); color: var(--fg); }
.menu-btn { display: none; }

/* ---------- card layout: drawer + reading ---------- */
.main { min-height: calc(100dvh - var(--head-h)); padding-bottom: 140px; }
.card { display: grid; grid-template-columns: 340px minmax(0, 1fr); }
.drawer { border-inline-end: 1px solid var(--line); background: var(--bg-2); min-height: calc(100dvh - var(--head-h)); }
.drawer-in { position: sticky; top: var(--head-h); max-height: calc(100dvh - var(--head-h)); overflow: auto; padding: 24px 20px 160px; }
.d-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; font-size: 13px; letter-spacing: 0; color: var(--fg-3); font-weight: 700; text-transform: none; }
.d-title .num { color: var(--fg-2); }
.meter { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.meter i { display: block; height: 100%; background: var(--accent); transform: scaleX(var(--pct, 0)); transform-origin: right; transition: transform var(--slow) var(--ease); }
.fv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 10px; margin: 0 -10px; border-radius: var(--r); cursor: pointer; border-inline-start: 2px solid transparent; transition: background-color var(--mid) var(--ease), border-color var(--mid) var(--ease); animation: fade var(--slow) var(--ease) both; animation-delay: calc(min(var(--i), 12) * 60ms); }
.fv:hover, .fv.lit { background: var(--bg-3); border-inline-start-color: var(--accent); }
.fv-label { grid-column: 1; font-size: 12px; color: var(--fg-3); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.fv-value { grid-column: 1; font-size: 15px; color: var(--fg); }
.fv[data-state="unreviewed"] .fv-value { color: var(--brass); }
.fv[data-state="unreviewed"] .fv-label::after { content: "لم يُراجَع"; font-weight: 400; color: var(--brass); margin-inline-start: 4px; }
.fv[data-state="warn"] { background: color-mix(in oklch, var(--warn) 10%, transparent); border-inline-start-color: var(--warn); }
.fv[data-state="warn"] .fv-label { color: var(--warn); }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 30px; padding: 0 10px; border: 1px solid var(--accent-2); border-radius: 999px; background: none; color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; opacity: 0; transition: opacity var(--fast), background-color var(--fast); display: inline-flex; align-items: center; gap: 4px; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv-btn:hover { background: var(--accent-soft); }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border-color: transparent; color: var(--fg-3); padding-inline: 0; }
@media (hover: none) { .fv-btn { opacity: 1; } }

.read { padding: 48px 64px 0; max-width: 820px; }
.r-head { margin-bottom: 36px; animation: fade var(--slow) var(--ease) both; }
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-3); font-size: 14px; background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 18px; }
.crumb:hover { color: var(--accent); }
.r-no { display: flex; align-items: baseline; gap: 14px; color: var(--brass); font-family: var(--font-display); font-size: 22px; }
.r-no small { font-family: var(--font-ui); font-size: 13px; color: var(--fg-3); }
.r-head h1 { margin: 6px 0 10px; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.3; text-wrap: balance; }
.r-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--fg-2); font-size: 14px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; }
.badge .ic { width: 13px; height: 13px; }
.badge-ok { color: var(--ok); } .badge-warn { color: var(--brass); }
.r-actions { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: none; color: var(--fg); cursor: pointer; font-size: 14px; font-weight: 700; transition: background-color var(--fast), border-color var(--fast), transform 100ms; }
.btn:hover { background: var(--bg-3); } .btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: oklch(0.15 0.02 250); }
.btn-primary:hover { background: var(--accent-2); }
.btn-ghost { border-color: transparent; color: var(--fg-2); }
.btn-secondary { border-color: var(--accent-2); color: var(--accent); }
.btn-icon { width: 40px; padding: 0; justify-content: center; }
.rule { height: 1px; background: linear-gradient(to left, var(--brass), transparent 70%); margin: 28px 0; transform: scaleX(0); transform-origin: right; animation: draw var(--slow) var(--ease) 200ms both; }
@keyframes draw { to { transform: scaleX(1); } }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.para { position: relative; margin: 0 0 22px; padding: 6px 0 6px; font-family: var(--font-display); font-size: 21px; line-height: 2; color: var(--fg); transition: color var(--mid) var(--ease), background-color var(--mid); animation: fade var(--slow) var(--ease) both; animation-delay: calc(var(--p) * 70ms); }
.read:has(.para.lit) .para:not(.lit) { color: var(--fg-3); }
.para.flash { background: var(--accent-soft); box-shadow: 0 0 0 10px var(--accent-soft); border-radius: 2px; }
.pnum { position: absolute; inset-inline-start: -44px; top: 12px; font-family: var(--font-ui); font-size: 12px; color: var(--fg-3); width: 28px; text-align: center; border: 1px solid var(--line); border-radius: 999px; line-height: 26px; }
.para.lit .pnum { color: var(--accent); border-color: var(--accent); }

.summary { margin: 0 0 28px; padding: 18px 22px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); font-size: 15px; line-height: 1.9; animation: fade var(--mid) var(--ease) both; }
.summary-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); font-weight: 700; }
.ai-label .ic { width: 14px; height: 14px; }
.cite { display: inline-flex; align-items: center; margin-inline: 2px; padding: 0 6px; border: 1px solid var(--brass); border-radius: 3px; background: none; color: var(--brass); font-family: var(--font-ui); font-size: 12px; font-weight: 700; line-height: 1.7; cursor: pointer; vertical-align: baseline; transition: background-color var(--fast); }
.cite:hover { background: color-mix(in oklch, var(--brass) 15%, transparent); }
.cite.unrev { border-style: dashed; }

/* ---------- list ---------- */
.list { padding: 48px 64px; max-width: 1100px; }
.list h1 { margin: 0 0 6px; font-family: var(--font-display); font-size: 40px; }
.list-meta { color: var(--fg-2); margin-bottom: 28px; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px 150px; gap: 20px; align-items: center; padding: 18px 10px; margin: 0 -10px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color var(--fast); animation: fade var(--slow) var(--ease) both; animation-delay: calc(var(--i) * 60ms); }
.row:hover { background: var(--bg-2); }
.row-no { font-family: var(--font-display); font-size: 20px; color: var(--brass); }
.row-no small { display: block; font-family: var(--font-ui); font-size: 12px; color: var(--fg-3); }
.row-title { font-size: 18px; font-weight: 700; }
.row-sub { display: block; color: var(--fg-3); font-size: 13px; font-weight: 400; }
.row-date { color: var(--fg-2); font-size: 14px; }

/* ---------- command bar assistant ---------- */
.cmd {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 30;
  width: min(760px, calc(100vw - 32px));
  background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 14px;
  box-shadow: 0 20px 60px oklch(0 0 0 / .45);
  display: flex; flex-direction: column; overflow: hidden;
  transition: box-shadow var(--mid);
}
.cmd-log { display: none; max-height: 48vh; overflow: auto; padding: 18px 20px; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--line); }
.app.assist-open .cmd-log { display: flex; }
.as-intro { margin: 0; color: var(--fg-2); font-size: 14px; }
.sugg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sugg button { padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: none; color: var(--fg); font-size: 13px; cursor: pointer; transition: border-color var(--fast), background-color var(--fast); }
.sugg button:hover { border-color: var(--accent); background: var(--accent-soft); }
.msg-user { align-self: flex-end; padding: 8px 14px; background: var(--bg-3); border-radius: 12px 12px 2px 12px; font-size: 15px; max-width: 80%; }
.msg-ai { font-size: 15px; line-height: 1.9; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 14px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 900ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 12px; margin-top: 4px; }
.ai-actions { margin-top: 8px; }
.cmd-bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; }
.cmd-bar .ic { color: var(--accent); }
.cmd-bar textarea { flex: 1; resize: none; field-sizing: content; max-height: 7rem; min-height: 24px; background: none; border: 0; padding: 6px 0; font-size: 15px; line-height: 1.5; }
.cmd-bar textarea:focus-visible { outline: none; }
.cmd-ctx { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent); color: oklch(0.15 0.02 250); display: grid; place-items: center; cursor: pointer; }
.send[data-mode="stop"] { background: var(--brass); }
.cmd-tools { border: 0; background: none; color: var(--fg-2); font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 10px; border-radius: var(--r); }
.cmd-tools:hover { background: var(--bg-3); color: var(--fg); }
.cmd-kbd { font-size: 11px; color: var(--fg-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }

/* ---------- compare dialog ---------- */
.cmp { width: min(720px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-2); color: var(--fg); box-shadow: 0 30px 80px oklch(0 0 0 / .5); opacity: 0; transform: translateY(12px); transition: opacity var(--mid) var(--ease), transform var(--mid) var(--ease), overlay var(--mid) allow-discrete, display var(--mid) allow-discrete; }
.cmp[open] { opacity: 1; transform: none; }
@starting-style { .cmp[open] { opacity: 0; transform: translateY(12px); } }
.cmp::backdrop { background: oklch(0 0 0 / .55); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.cmp-head h2 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.cmp-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 22px; font-size: 13px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 2px; cursor: pointer; }
.cmp-pick button[aria-pressed="true"] .stamp { border-color: var(--accent); color: var(--accent); }
.stamp { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; color: var(--fg-2); font-size: 12px; font-weight: 700; }
.stamp > span { padding: 3px 8px; } .stamp > span + span { border-inline-start: 1px solid var(--line-2); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp-tbl th, .cmp-tbl td { padding: 12px 22px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 12px; width: 22%; }
.cmp-tbl tr[data-diff="yes"] td:last-child { color: var(--warn); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--warn); margin-top: 2px; }
.cmp-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px; border-top: 1px solid var(--line); }

.toasts { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 8px 16px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 14px; animation: fade var(--mid) var(--ease) both; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 12px; inset-inline-end: 16px; z-index: 40; font-size: 12px; color: var(--fg-3); text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
.hub-link:hover { color: var(--fg); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .read { padding-inline: 48px 40px; } }
@media (max-width: 900px) {
  .card { grid-template-columns: minmax(0, 1fr); }
  .drawer { border: 0; border-bottom: 1px solid var(--line); min-height: 0; }
  .drawer-in { position: static; max-height: none; padding-bottom: 24px; }
  .read { padding: 32px 24px 0; }
  .r-head h1 { font-size: 30px; }
  .para { font-size: 19px; }
  .pnum { position: static; display: inline-block; margin-inline-end: 8px; vertical-align: middle; }
  .topnav { display: none; }
  .menu-btn { display: grid; }
  .top { padding: 0 16px; }
  .list { padding: 32px 24px; }
  .row { grid-template-columns: 110px minmax(0, 1fr); }
  .row-date, .row-badge { display: none; }
  .cmd-ctx, .cmd-kbd { display: none; }
  .hub-link { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; animation-delay: 0ms !important; transition-duration: 0ms !important; }
  .rule { transform: none; }
}
</style>
</head>
<body>
<a class="hub-link" href="../">← التصاميم الأربعة</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, counts, badge, fvHTML, assistEmptyHTML, ctxText, $, $$ } = Q;

  function renderCard(r) {
    const [d, t] = counts(r);
    let k = 0;
    const fields = r.fields.map((f, idx) => fvHTML(r, f, idx, k++)).join('');
    const paras = r.paras.map((txt, i) => `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}" style="--p:${i}"><span class="pnum num">${i + 1}</span>${txt}</p>`).join('');
    return `<div class="card">
      <aside class="drawer" aria-label="ملف الحكم">
        <div class="drawer-in">
          <h2 class="d-title">ملف الحكم <span class="num" id="rc-count">${d} من ${t} مراجَع</span></h2>
          <div class="meter" id="rc-pct" style="--pct:${t ? d / t : 0}"><i></i></div>
          ${fields}
        </div>
      </aside>
      <div class="read">
        <header class="r-head" id="head">
          <button class="crumb" data-action="list">${svg(IC.back)} الأحكام</button>
          <div class="r-no"><span class="num" style="view-transition-name:stamp-${r.id}">${r.no} / ${r.year}</span><small>${r.circuit}</small></div>
          <h1>${r.title}</h1>
          <p class="r-meta">${r.kind} · صدر <span class="num">${r.date}</span> <span id="rc-badge">${badge(r)}</span></p>
          <div class="r-actions">
            <button class="btn btn-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check)}راجعت الكل</button>
            <button class="btn" data-action="summarize">${svg(IC.sum)}لخّص</button>
            <button class="btn" data-action="compare">${svg(IC.compare)}قارن مع…</button>
          </div>
        </header>
        <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
        <div class="rule" aria-hidden="true"></div>
        <article aria-label="نص الحكم">${paras}</article>
      </div>
    </div>`;
  }
  function renderList() {
    const pending = ORDER.filter(id => { const [d, t] = counts(R[id]); return d < t; }).length;
    const rows = ORDER.map((id, i) => { const r = R[id]; const [d, t] = counts(r); const dispute = (r.fields.find(f => f.k === 'dispute') || {}).value || '';
      return `<div class="row" tabindex="0" data-open="${id}" style="--i:${i}" aria-label="افتح ${r.title}">
        <div class="row-no"><span class="num" style="view-transition-name:stamp-${id}">${r.no} / ${r.year}</span><small>${r.circuit} · ${r.kind}</small></div>
        <div class="row-title">${r.title}<span class="row-sub">${dispute}</span></div>
        <div class="row-date num">${r.date}</div>
        <div class="row-badge">${badge(r)} <span class="num" style="color:var(--fg-3);font-size:12px">${d}/${t}</span></div>
      </div>`; }).join('');
    return `<div class="list"><header id="head"><h1>الأحكام</h1><p class="list-meta"><span class="num">${ORDER.length}</span> أحكام مفهرسة · <span class="num">${pending}</span> بانتظار المراجعة</p></header><div class="rows">${rows}</div></div>`;
  }
  function shell() {
    const dark = document.documentElement.dataset.theme !== 'light';
    return `<div class="app" id="app">
      <header class="top">
        <button class="ib menu-btn" aria-label="القائمة">${svg(IC.menu)}</button>
        <div class="brand"><span class="brand-mark" aria-hidden="true">ق</span><span class="brand-name">ديوان المستشار<b>نظام القاضي</b></span></div>
        <nav class="topnav" aria-label="التنقّل">${NAV.map(([k, l]) => `<button data-action="nav" data-to="${k}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
        <div class="top-end"><button class="ib" data-action="theme" aria-label="${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}" id="theme-btn">${svg(dark ? IC.sun : IC.moon)}</button></div>
      </header>
      <main class="main" id="main">${S.view === 'card' ? renderCard(R[S.rid]) : renderList()}</main>
      <section class="cmd" aria-label="المساعد">
        <div class="cmd-log" id="as-log" role="log">${assistEmptyHTML()}</div>
        <form class="cmd-bar" id="as-form">
          ${svg(IC.spark)}
          <label class="sr-only" for="as-input">اسأل عن أحكامك</label>
          <textarea id="as-input" rows="1" placeholder="اسأل عن أحكامك… أو افتح ملفاً"></textarea>
          <span class="cmd-ctx" id="as-ctx">${ctxText()}</span>
          <button type="button" class="cmd-tools" data-action="draft">افحص مسودة</button>
          <span class="cmd-kbd" aria-hidden="true">⌘K</span>
          <button type="submit" class="send" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button>
        </form>
      </section>
    </div>`;
  }
  window.DESIGN = {
    key: 'diwan', shell, renderCard, renderList,
    beforeAsk() { $('#app')?.classList.add('assist-open'); },
    onAssistToggle() {},
    onTheme(dark) { const b = $('#theme-btn'); if (b) { b.innerHTML = svg(dark ? IC.sun : IC.moon); b.setAttribute('aria-label', dark ? 'الوضع الفاتح' : 'الوضع الداكن'); } }
  };
  document.addEventListener('focusin', e => { if (e.target.id === 'as-input') $('#app')?.classList.add('assist-open'); });
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#as-input')?.focus(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.cmd') && !e.target.closest('.cite')) $('#app')?.classList.remove('assist-open'); }, true);
  Q.initTheme(true);
  Q.mountAll();
})();
</script>
</body>
</html>
