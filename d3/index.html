<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>المساحة — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== المساحة — نمط Harvey: المحادثة في الوسط، المصدر يفتح بجانبها ===== */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-2: #f7f7f8; --bg-3: #efeff1;
  --line: #e6e6ea; --line-2: #d0d0d6;
  --fg: #141418; --fg-2: #4b4b55; --fg-3: #7a7a86;
  --accent: #2f4f6f; --accent-2: #1f3a55; --accent-soft: #e9eef4; --accent-line: #b9c8d8;
  --ok: #1d7a4a; --warn: #9a6400; --unrev: #b4541a; --unrev-soft: #fff1e8;
  --font-ui: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-reading: 'Noto Naskh Arabic', serif;
  --r: 10px; --r-sm: 6px;
  --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 150ms; --mid: 260ms;
  --nav-w: 232px; --doc-w: 520px;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 12px 32px rgb(20 20 24 / .08);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15161a; --bg-2: #1c1d22; --bg-3: #24252b; --line: #2b2c33; --line-2: #3a3b44;
  --fg: #ececf0; --fg-2: #b4b4bd; --fg-3: #83838f;
  --accent: #9cb8d4; --accent-2: #b6cbe2; --accent-soft: #242c36; --accent-line: #3f5168;
  --ok: #6cc595; --warn: #e6b84d; --unrev: #e6905f; --unrev-soft: #2e241d;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; } .ic-sm { width: 14px; height: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) 0; height: 100dvh; overflow: hidden; transition: grid-template-columns var(--mid) var(--ease); }
.app.doc-open { grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--doc-w); }

/* ---------- nav ---------- */
.nav { display: flex; flex-direction: column; padding: 14px 10px; background: var(--bg-2); border-inline-end: 1px solid var(--line); min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; font-weight: 600; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; }
.new-btn { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; margin-bottom: 14px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); font-weight: 500; cursor: pointer; font-size: 14px; }
.new-btn:hover { background: var(--bg-3); }
.nav-sec { font-size: 11px; font-weight: 600; color: var(--fg-3); padding: 10px 8px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg-2); text-align: start; cursor: pointer; font-size: 14px; transition: background-color var(--fast); }
.nav-item:hover { background: var(--bg-3); color: var(--fg); }
.nav-item[aria-current] { background: var(--bg); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
.nav-item .ic { color: var(--fg-3); }
.recent { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; }
.recent button { display: block; width: 100%; padding: 7px 8px; border: 0; border-radius: var(--r-sm); background: none; text-align: start; font-size: 13px; color: var(--fg-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent button:hover { background: var(--bg-3); color: var(--fg); }
.nav-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }

/* ---------- center: conversation ---------- */
.center { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.topbar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg-3); }
.topbar .stamp { margin-inline-start: 4px; }
.topbar .sp { flex: 1; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; color: var(--fg-2); border-radius: var(--r-sm); cursor: pointer; }
.ib:hover { background: var(--bg-3); color: var(--fg); }
.stamp { display: inline-flex; border: 1px solid var(--line-2); border-radius: 5px; font-size: 12px; font-weight: 600; color: var(--fg-2); background: var(--bg); }
.stamp > span { padding: 2px 8px; } .stamp > span + span { border-inline-start: 1px solid var(--line-2); }
.stamp-md { font-size: 13px; }
.thread { flex: 1; overflow: auto; min-height: 0; }
.thread-in { max-width: 760px; margin: 0 auto; padding: 32px 24px 40px; display: flex; flex-direction: column; gap: 22px; }

/* home state */
.home { padding-top: 10vh; text-align: center; }
.home h1 { margin: 0 0 8px; font-size: 30px; font-weight: 600; letter-spacing: 0; }
.home p { margin: 0 0 28px; color: var(--fg-2); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; text-align: start; }
.chips button { padding: 14px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); text-align: start; cursor: pointer; font-size: 14px; line-height: 1.5; transition: border-color var(--fast), box-shadow var(--fast), transform var(--fast); }
.chips button:hover { border-color: var(--accent-line); box-shadow: var(--shadow); transform: translateY(-1px); }
.chips button b { display: block; font-size: 11px; color: var(--fg-3); font-weight: 600; margin-bottom: 4px; }
.recent-h { margin: 32px 0 10px; font-size: 12px; color: var(--fg-3); font-weight: 600; text-align: start; }
.recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; text-align: start; }
.rc { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); cursor: pointer; transition: border-color var(--fast), box-shadow var(--fast); }
.rc:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
.rc-t { font-weight: 600; font-size: 14px; }
.rc-s { font-size: 12px; color: var(--fg-3); display: flex; justify-content: space-between; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.badge .ic { width: 12px; height: 12px; }
.badge-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.badge-warn { color: var(--unrev); background: var(--unrev-soft); }

/* messages */
.msg-user { align-self: flex-end; max-width: 80%; padding: 10px 16px; background: var(--bg-3); border-radius: 18px 18px 4px 18px; }
.msg-ai { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
.ai-av { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.ai-av .ic { width: 15px; height: 15px; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); font-weight: 600; margin-bottom: 4px; }
.ai-label .ic { width: 13px; height: 13px; }
.ai-body { line-height: 1.9; font-size: 15.5px; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 14px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 900ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 12px; margin-top: 4px; }
.cite { display: inline-flex; align-items: center; gap: 4px; margin-inline: 2px; padding: 1px 8px; border: 1px solid var(--accent-line); border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); font-size: 12px; font-weight: 600; cursor: pointer; vertical-align: baseline; line-height: 1.6; transition: background-color var(--fast); }
.cite:hover { background: var(--accent-line); }
.cite.unrev { border-color: var(--unrev); color: var(--unrev); background: var(--unrev-soft); }
.ai-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color var(--fast); }
.btn:hover { background: var(--bg-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn-primary:hover { background: var(--accent-2); }
.btn-ghost { border-color: transparent; color: var(--fg-2); background: none; }
.btn-secondary { border-color: var(--accent); color: var(--accent); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }

/* ruling card message (the "source card") */
.src-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); overflow: hidden; box-shadow: var(--shadow); }
.src-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; }
.src-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 12rem; }
.src-meta { font-size: 12px; color: var(--fg-3); }
.src-body { padding: 14px; display: grid; gap: 12px; }
.kp { display: grid; gap: 8px; }
.kp h3 { margin: 0; font-size: 12px; color: var(--fg-3); font-weight: 600; }
.fv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; transition: border-color var(--fast), background-color var(--fast); }
.fv:hover, .fv.lit { border-color: var(--accent-line); background: var(--accent-soft); }
.fv-label { grid-column: 1; font-size: 11px; color: var(--fg-3); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.fv-label::after { content: "¶" attr(data-pn); color: var(--fg-3); font-weight: 400; margin-inline-start: auto; opacity: .8; }
.fv-value { grid-column: 1; font-size: 14px; }
.fv[data-state="unreviewed"] { border-inline-start: 3px solid var(--unrev); }
.fv[data-state="unreviewed"] .fv-value { color: var(--unrev); }
.fv[data-state="warn"] { border-inline-start: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 7%, transparent); }
.fv[data-state="warn"] .fv-label { color: var(--warn); }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); font-size: 11px; font-weight: 600; cursor: pointer; opacity: 0; transition: opacity var(--fast); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv-btn:hover { border-color: var(--accent); color: var(--accent); }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border-color: transparent; color: var(--ok); padding-inline: 0; }
@media (hover: none) { .fv-btn { opacity: 1; } }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.src-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.src-actions .num { margin-inline-start: auto; font-size: 12px; color: var(--fg-3); }
.summary { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-2); font-size: 14px; line-height: 1.9; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }

/* composer */
.composer { padding: 10px 24px 18px; }
.composer form { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--bg); box-shadow: var(--shadow); }
.composer form:focus-within { border-color: var(--accent-line); }
.composer textarea { flex: 1; resize: none; field-sizing: content; min-height: 28px; max-height: 8rem; border: 0; background: none; padding: 6px 0; font-size: 15px; line-height: 1.5; }
.composer textarea:focus-visible { outline: none; }
.send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
.send[data-mode="stop"] { background: var(--unrev); }
.composer .hint { max-width: 760px; margin: 8px auto 0; font-size: 11px; color: var(--fg-3); text-align: center; }

/* ---------- document panel ---------- */
.doc { display: flex; flex-direction: column; min-height: 0; border-inline-start: 1px solid var(--line); background: var(--bg-2); overflow: hidden; visibility: hidden; }
.app.doc-open .doc { visibility: visible; }
.doc-head { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.doc-head .sp { flex: 1; }
.doc-body { flex: 1; overflow: auto; padding: 20px 22px 60px; }
.doc-title { font-family: var(--font-reading); font-size: 20px; font-weight: 600; margin: 0 0 14px; }
.para { margin: 0 0 4px; padding: 8px 10px; font-family: var(--font-reading); font-size: 16.5px; line-height: 1.95; border-radius: var(--r-sm); border-inline-start: 2px solid transparent; transition: background-color var(--fast), border-color var(--fast); }
.para:hover, .para.lit { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.para.flash { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.pnum { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); margin-inline-end: 8px; }

/* ---------- compare ---------- */
.cmp { width: min(680px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
.cmp::backdrop { background: rgb(20 20 24 / .4); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cmp-head h2 { margin: 0; font-size: 16px; }
.cmp-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 12px 18px; font-size: 13px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 1px; cursor: pointer; }
.cmp-pick button[aria-pressed="true"] .stamp { border-color: var(--accent); color: var(--accent); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp-tbl th, .cmp-tbl td { padding: 10px 18px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 12px; width: 22%; font-weight: 600; }
.cmp-tbl tr[data-diff="yes"] td:last-child { color: var(--warn); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--warn); }
.cmp-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 18px; border-top: 1px solid var(--line); }
.toasts { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 13px; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 10px; inset-inline-end: 12px; z-index: 40; font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
.as-empty { display: none; }

@media (max-width: 1200px) { :root { --doc-w: 420px; } }
@media (max-width: 960px) {
  .app, .app.doc-open { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .doc { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(var(--doc-w), 100vw); z-index: 30; box-shadow: var(--shadow); transform: translateX(-100%); transition: transform var(--mid) var(--ease); visibility: visible; }
  .app.doc-open .doc { transform: none; }
}
@media (max-width: 720px) {
  .app, .app.doc-open { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .nav { flex-direction: row; align-items: center; gap: 6px; padding: 8px 10px; border-inline-end: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .brand { padding: 0; margin-inline-end: 6px; }
  .nav-sec, .recent, .nav-foot { display: none; }
  .new-btn { margin: 0; height: 32px; }
  .nav-item { width: auto; flex: none; }
  .nav-item .lbl { display: none; }
  .thread-in { padding: 20px 14px 30px; }
  .home { padding-top: 4vh; } .home h1 { font-size: 24px; }
  .composer { padding: 8px 12px 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; } }
</style>
</head>
<body>
<a class="hub-link" href="../">← التصاميم</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, SUGG, counts, badge, stamp, ctxText, $, $$ } = Q;
  function fvHTML(r, f, idx, k) {
    const warn = f.state === 'warn';
    const btn = warn ? '' : (f.state === 'reviewed'
      ? `<button class="fv-btn" data-action="toggle-review" aria-label="ألغِ المراجعة: ${f.label}">${svg(IC.check, 'ic-sm')}مراجَع</button>`
      : `<button class="fv-btn" data-action="toggle-review" aria-label="راجعت: ${f.label}">راجعت</button>`);
    return `<div class="fv" data-state="${f.state}" data-r="${r.id}" data-f="${idx}" data-p="${f.p}" style="--i:${k}" tabindex="0">
      <span class="fv-label" data-pn="${f.p + 1}">${warn ? svg(IC.alert, 'ic-sm') : ''}${f.label}</span><span class="fv-value">${f.value}</span>${btn}</div>`;
  }
  function srcCard(r) {
    const [d, t] = counts(r);
    const fields = r.fields.map((f, idx) => fvHTML(r, f, idx, idx)).join('');
    return `<div class="src-card" id="src-${r.id}">
      <div class="src-head">${stamp(r, 'md', true)}<h2>${r.title}</h2><span class="src-meta">${r.kind} · <span class="num">${r.date}</span></span><span id="rc-badge">${badge(r)}</span></div>
      <div class="src-body">
        <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
        <div class="kp"><h3>ما استخرجه النظام — راجع قبل الاعتماد</h3><div class="fgrid">${fields}</div></div>
        <div class="src-actions">
          <button class="btn" data-action="open-doc" data-id="${r.id}">${svg(IC.rulings, 'ic-sm')}افتح النص الكامل</button>
          <button class="btn btn-ghost" data-action="summarize">${svg(IC.sum, 'ic-sm')}لخّص</button>
          <button class="btn btn-ghost" data-action="compare">${svg(IC.compare, 'ic-sm')}قارن مع…</button>
          <button class="btn btn-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check, 'ic-sm')}راجعت الكل</button>
          <span class="num" id="rc-count">${d} من ${t} مراجَع</span>
        </div>
      </div>
    </div>`;
  }
  // the "card" view = a thread that starts with the source card for the ruling
  function renderCard(r) {
    return `<div class="thread-in" id="as-log" role="log">
      <div class="msg-user">افتح الطعن ${r.no}/${r.year}</div>
      <div class="msg-ai"><div class="ai-av">${svg(IC.spark)}</div><div><span class="ai-label">${svg(IC.info)}من أرشيفك — مولَّد، راجع الاستشهادات</span>${srcCard(r)}</div></div>
    </div>`;
  }
  function renderList() {
    const pending = ORDER.filter(id => { const [d, t] = counts(R[id]); return d < t; }).length;
    const cards = ORDER.map(id => { const r = R[id]; const [d, t] = counts(r);
      return `<div class="rc" tabindex="0" data-open="${id}" aria-label="افتح ${r.title}"><div>${stamp(r, 'sm', true)}</div><div class="rc-t">${r.title}</div><div class="rc-s"><span class="num">${r.date}</span>${badge(r)}</div></div>`; }).join('');
    return `<div class="thread-in home" id="as-log" role="log">
      <h1>بماذا أساعدك اليوم؟</h1>
      <p>أجيب من أحكامك المفهرسة فقط — <span class="num">${ORDER.length}</span> أحكام، <span class="num">${pending}</span> بانتظار مراجعتك.</p>
      <div class="chips">
        ${SUGG.map(([k, l], i) => `<button data-q="${k}"><b>${['اتساق', 'النيابة', 'مبدأ'][i]}</b>${l}</button>`).join('')}
        <button data-action="draft"><b>فحص</b>افحص مسودة حكم على مبادئي السابقة</button>
      </div>
      <div class="recent-h">آخر الأحكام</div>
      <div class="recent-grid">${cards}</div>
    </div>`;
  }
  function docPanel(r) {
    if (!r) return '';
    const paras = r.paras.map((txt, i) => `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}"><span class="pnum num">${i + 1}</span>${txt}</p>`).join('');
    return `<div class="doc-head">${stamp(r, 'sm', false)}<span class="sp"></span><button class="ib" data-action="close-doc" aria-label="أغلق النص">${svg(IC.x)}</button></div><div class="doc-body"><h2 class="doc-title">${r.title}</h2>${paras}</div>`;
  }
  function shell() {
    const dark = document.documentElement.dataset.theme === 'dark';
    return `<div class="app ${S.view === 'card' ? 'doc-open' : ''}" id="app">
      <nav class="nav" aria-label="التنقّل">
        <div class="brand"><span class="brand-mark" aria-hidden="true">ق</span><span class="lbl">نظام القاضي</span></div>
        <button class="new-btn" data-action="list">${svg(IC.msg, 'ic-sm')}<span class="lbl">محادثة جديدة</span></button>
        ${NAV.filter(([k]) => k !== 'home').map(([k, l]) => `<button class="nav-item" data-action="nav" data-to="${k}" aria-label="${l}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${svg(IC[k])}<span class="lbl">${l}</span></button>`).join('')}
        <div class="nav-sec">أعمال أخيرة</div>
        <div class="recent">${ORDER.map(id => `<button data-open="${id}">${R[id].title}</button>`).join('')}<button data-q="nyaba">${SUGG[1][1]}</button></div>
        <div class="nav-foot"><button class="nav-item" data-action="theme" id="theme-btn">${svg(dark ? IC.sun : IC.moon)}<span class="lbl">${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}</span></button></div>
      </nav>
      <section class="center">
        <div class="topbar"><span id="as-ctx">${ctxText()}</span><span class="sp"></span><button class="ib" data-action="assist" aria-label="النص الكامل">${svg(IC.rulings)}</button></div>
        <main class="thread" id="main">${S.view === 'card' ? renderCard(R[S.rid]) : renderList()}</main>
        <div class="composer" id="head">
          <form id="as-form"><label class="sr-only" for="as-input">اسأل عن أحكامك</label><textarea id="as-input" rows="1" placeholder="اسأل عن أحكامك… أو اكتب رقم طعن"></textarea><button type="submit" class="send" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button></form>
          <div class="hint">كل جواب مولَّد ويحمل استشهاداً بفقرة من أحكامك. ما لا يوجد في أرشيفك لن يُجاب عنه.</div>
        </div>
      </section>
      <aside class="doc" id="doc" aria-label="نص الحكم">${docPanel(S.view === 'card' ? R[S.rid] : null)}</aside>
    </div>`;
  }
  function openDoc(id) { const d = $('#doc'); d.innerHTML = docPanel(R[id]); $('#app').classList.add('doc-open'); }
  window.DESIGN = {
    key: 'masaha', shell, renderCard, renderList, fvHTML,
    afterView() { if (S.view === 'card') openDoc(S.rid); else $('#app')?.classList.remove('doc-open'); },
    beforeCite() {},
    beforeAsk() { if (S.view !== 'card') { $('#main').innerHTML = '<div class="thread-in" id="as-log" role="log"></div>'; } },
    onAction(act, a) {
      if (act === 'open-doc') { openDoc(a.dataset.id); return true; }
      if (act === 'close-doc') { $('#app').classList.remove('doc-open'); return true; }
      if (act === 'assist') { $('#app').classList.toggle('doc-open'); return true; }
      return false;
    },
    onTheme(dark) { const b = $('#theme-btn'); if (b) b.innerHTML = svg(dark ? IC.sun : IC.moon) + `<span class="lbl">${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}</span>`; }
  };
  // citation → make sure the doc panel shows that ruling, then flash paragraph
  document.addEventListener('click', e => {
    const c = e.target.closest('.cite'); if (!c) return;
    const id = c.dataset.r;
    if (S.view !== 'card' || S.rid !== id) return; // shared handles navigation (which re-opens doc)
    openDoc(id);
  }, true);
  Q.initTheme(false);
  Q.mountAll();
})();
</script>
</body>
</html>
