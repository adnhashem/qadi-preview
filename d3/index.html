<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>المسطرة — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== المسطرة — لوحة عمل كثيفة، ثلاث نوافذ، سريعة ===== */
:root {
  color-scheme: light;
  --bg: oklch(0.985 0.004 240);
  --bg-2: oklch(0.965 0.006 240);
  --bg-3: oklch(0.94 0.008 240);
  --line: oklch(0.90 0.008 240);
  --line-2: oklch(0.80 0.01 240);
  --fg: oklch(0.20 0.02 250);
  --fg-2: oklch(0.42 0.02 250);
  --fg-3: oklch(0.56 0.015 250);
  --accent: oklch(0.52 0.14 225);
  --accent-2: oklch(0.44 0.14 225);
  --accent-soft: oklch(0.52 0.14 225 / .10);
  --accent-line: oklch(0.52 0.14 225 / .35);
  --warn: oklch(0.55 0.14 70); --warn-soft: oklch(0.80 0.14 80 / .18);
  --ok: oklch(0.50 0.13 155);
  --unrev: oklch(0.58 0.17 35);
  --font-ui: 'Noto Kufi Arabic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 4px; --fast: 120ms; --mid: 200ms; --ease: cubic-bezier(0.2, 0, 0, 1);
  --rail: 56px; --list-w: 340px; --as-w: 380px; --bar: 48px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: oklch(0.19 0.012 250); --bg-2: oklch(0.22 0.014 250); --bg-3: oklch(0.26 0.016 250);
  --line: oklch(0.30 0.015 250); --line-2: oklch(0.40 0.015 250);
  --fg: oklch(0.93 0.01 240); --fg-2: oklch(0.74 0.01 240); --fg-3: oklch(0.60 0.01 240);
  --accent: oklch(0.72 0.12 225); --accent-2: oklch(0.78 0.12 225); --accent-soft: oklch(0.72 0.12 225 / .14); --accent-line: oklch(0.72 0.12 225 / .4);
  --warn: oklch(0.80 0.13 80); --ok: oklch(0.74 0.12 155); --unrev: oklch(0.76 0.14 40);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ic { width: 18px; height: 18px; flex: none; } .ic-sm { width: 14px; height: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

.app { display: grid; grid-template-columns: var(--rail) var(--list-w) minmax(0, 1fr) 0; height: 100dvh; overflow: hidden; }
.app.assist-open { grid-template-columns: var(--rail) var(--list-w) minmax(0, 1fr) var(--as-w); }

/* ---------- rail ---------- */
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-inline-end: 1px solid var(--line); background: var(--bg-2); }
.rail-mark { width: 32px; height: 32px; display: grid; place-items: center; background: var(--accent); color: #fff; border-radius: 6px; font-weight: 700; margin-bottom: 10px; }
.rail button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--fg-3); border-radius: var(--r); cursor: pointer; position: relative; transition: background-color var(--fast), color var(--fast); }
.rail button:hover { background: var(--bg-3); color: var(--fg); }
.rail button[aria-current] { color: var(--accent); background: var(--accent-soft); }
.rail-foot { margin-top: auto; }
.tip { position: absolute; inset-inline-start: 100%; top: 50%; transform: translateY(-50%); margin-inline-start: 8px; background: var(--fg); color: var(--bg); padding: 3px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--fast); z-index: 50; }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; }

/* ---------- list pane ---------- */
.pane { display: flex; flex-direction: column; border-inline-end: 1px solid var(--line); min-height: 0; background: var(--bg); }
.pane-head { height: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.pane-head .cnt { color: var(--fg-3); font-weight: 400; }
.search { margin: 8px 12px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--r); color: var(--fg-3); background: var(--bg-2); }
.search input { flex: 1; border: 0; background: none; font-size: 13px; min-width: 0; }
.search input:focus-visible { outline: none; }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; }
.rows { overflow: auto; flex: 1; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; border-inline-start: 3px solid transparent; transition: background-color var(--fast); }
.row:hover { background: var(--bg-2); }
.row[aria-current] { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.row-no { font-size: 12px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; }
.row-title { grid-column: 1; font-weight: 600; font-size: 13.5px; }
.row-sub { grid-column: 1; color: var(--fg-3); font-size: 12px; }
.row-rev { grid-column: 2; grid-row: 1 / 4; align-self: center; }
.ring { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); background: conic-gradient(var(--accent) calc(var(--pct) * 360deg), var(--line) 0); }
.ring i { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-style: normal; }
.row[aria-current] .ring i { background: color-mix(in oklch, var(--bg) 90%, var(--accent)); }

/* ---------- detail ---------- */
.detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.bar { height: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
.bar h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stamp { display: inline-flex; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent-2); border: 1px solid var(--accent-line); border-radius: 3px; direction: ltr; }
.stamp > span { padding: 2px 7px; } .stamp > span + span { border-left: 1px solid var(--accent-line); }
.stamp-md > span { padding: 4px 9px; font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.badge .ic { width: 12px; height: 12px; }
.badge-ok { color: var(--ok); background: color-mix(in oklch, var(--ok) 12%, transparent); }
.badge-warn { color: var(--unrev); background: color-mix(in oklch, var(--unrev) 12%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--fg); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: var(--bg-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn-primary:hover { background: var(--accent-2); }
.btn-ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn-secondary { border-color: var(--accent); color: var(--accent); }
.btn-icon { width: 32px; padding: 0; justify-content: center; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
.tab { height: 38px; padding: 0 12px; border: 0; background: none; color: var(--fg-2); font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); background: var(--bg-3); padding: 0 6px; border-radius: 3px; }
.grid-wrap { flex: none; max-height: 42vh; overflow: auto; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.fv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-content: start; padding: 8px 12px; background: var(--bg); cursor: pointer; border-inline-start: 3px solid transparent; transition: background-color var(--fast); min-height: 60px; }
.fv:hover, .fv.lit { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.fv-label { grid-column: 1; font-size: 11px; color: var(--fg-3); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.fv-label::before { content: "¶" attr(data-pn); font-family: var(--font-mono); color: var(--fg-3); opacity: .7; font-weight: 400; }
.fv-value { grid-column: 1; font-size: 13px; font-weight: 500; }
.fv[data-state="unreviewed"] .fv-label { color: var(--unrev); }
.fv[data-state="unreviewed"] .fv-value { color: var(--unrev); }
.fv[data-state="unreviewed"] { border-inline-start-color: var(--unrev); }
.fv[data-state="warn"] { background: var(--warn-soft); border-inline-start-color: var(--warn); }
.fv[data-state="warn"] .fv-label { color: var(--warn); }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 26px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--fg-2); font-size: 11px; font-weight: 600; cursor: pointer; opacity: 0; transition: opacity var(--fast); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv-btn:hover { border-color: var(--accent); color: var(--accent); }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border-color: transparent; color: var(--ok); padding-inline: 0; background: none; }
@media (hover: none) { .fv-btn { opacity: 1; } }
.tabpanel[hidden] { display: none; }
.plist { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); font-size: 13px; }
.chip .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }

.text { flex: 1; overflow: auto; padding: 20px 24px 60px; max-width: 900px; scroll-padding-block-start: 12px; }
.para { position: relative; margin: 0 0 6px; padding: 10px 14px 10px 10px; font-size: 16px; line-height: 1.95; border-radius: var(--r); border-inline-start: 3px solid transparent; transition: background-color var(--fast), border-color var(--fast); }
.para:hover, .para.lit { background: var(--bg-2); border-inline-start-color: var(--accent); }
.para.flash { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.pnum { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-inline-end: 10px; }
.para[data-has="1"] .pnum { color: var(--accent); }
.summary { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-2); font-size: 13.5px; line-height: 1.9; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.ai-label { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-3); font-weight: 600; }
.ai-label .ic { width: 13px; height: 13px; }
.cite { display: inline-flex; align-items: center; margin-inline: 2px; padding: 0 5px; border: 1px solid var(--accent-line); border-radius: 3px; background: var(--bg); color: var(--accent-2); font-family: var(--font-mono); font-size: 11px; font-weight: 600; line-height: 1.7; cursor: pointer; direction: ltr; }
.cite:hover { background: var(--accent-soft); }
.cite.unrev { border-color: var(--unrev); color: var(--unrev); border-style: dashed; }
.empty { padding: 60px 24px; color: var(--fg-3); text-align: center; }

/* ---------- assistant sheet ---------- */
.assist { display: flex; flex-direction: column; min-height: 0; border-inline-start: 1px solid var(--line); background: var(--bg); overflow: hidden; visibility: hidden; }
.app.assist-open .assist { visibility: visible; }
.as-head { height: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.as-ctx { margin-inline-start: auto; font-size: 11px; color: var(--fg-3); font-weight: 400; }
.as-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.as-intro { margin: 0 0 8px; color: var(--fg-2); font-size: 13px; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg button { text-align: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); font-size: 13px; cursor: pointer; transition: border-color var(--fast); }
.sugg button:hover { border-color: var(--accent); }
.msg-user { align-self: flex-end; max-width: 88%; padding: 6px 10px; background: var(--accent-soft); border-radius: var(--r); font-size: 13px; }
.msg-ai { font-size: 13.5px; line-height: 1.85; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 13px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 700ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 11px; margin-top: 4px; }
.ai-actions { margin-top: 8px; }
.as-tools { padding: 0 12px 8px; }
.as-form { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
.as-form textarea { flex: 1; resize: none; field-sizing: content; min-height: 32px; max-height: 7rem; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-2); font-size: 13px; line-height: 1.5; }

/* ---------- compare ---------- */
.cmp { width: min(680px, calc(100vw - 24px)); padding: 0; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--fg); box-shadow: 0 16px 48px oklch(0 0 0 / .25); }
.cmp::backdrop { background: oklch(0.2 0.02 250 / .4); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cmp-head h2 { margin: 0; font-size: 14px; }
.cmp-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 14px; font-size: 12px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 1px; cursor: pointer; }
.cmp-pick button[aria-pressed="true"] .stamp { background: var(--accent-soft); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp-tbl th, .cmp-tbl td { padding: 8px 14px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 11px; width: 22%; font-weight: 600; }
.cmp-tbl tr[data-diff="yes"] td:last-child { color: var(--warn); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--warn); }
.cmp-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 6px 12px; border-radius: var(--r); background: var(--fg); color: var(--bg); font-size: 13px; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 10px; inset-inline-end: 12px; z-index: 40; font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-radius: 3px; background: var(--bg-2); border: 1px solid var(--line); }

/* ---------- responsive ---------- */
@media (max-width: 1200px) { :root { --list-w: 280px; --as-w: 320px; } }
@media (max-width: 960px) {
  .app, .app.assist-open { grid-template-columns: var(--rail) minmax(0, 1fr); }
  .pane { display: none; }
  .app.show-list .pane { display: flex; grid-column: 2; }
  .app.show-list .detail { display: none; }
  .assist { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(var(--as-w), 100vw); z-index: 30; box-shadow: 0 0 40px oklch(0 0 0 / .25); transform: translateX(-100%); transition: transform var(--mid) var(--ease); visibility: visible; }
  .app.assist-open .assist { transform: none; }
  .grid-wrap { max-height: 36vh; }
}
@media (max-width: 640px) {
  :root { --rail: 48px; }
  .bar .lbl { display: none; }
  .fgrid { grid-template-columns: 1fr 1fr; }
  .text { padding: 12px 12px 60px; }
  .para { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; } }
</style>

<body>
<a class="hub-link" href="../">← التصاميم الأربعة</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, counts, badge, stamp, assistEmptyHTML, ctxText, $, $$ } = Q;
  const TAB = { key: 'fields' };
  function fvHTML(r, f, idx, k) {
    const warn = f.state === 'warn';
    const btn = warn ? '' : (f.state === 'reviewed'
      ? `<button class="fv-btn" data-action="toggle-review" aria-label="ألغِ المراجعة: ${f.label}">${svg(IC.check, 'ic-sm')}مراجَع</button>`
      : `<button class="fv-btn" data-action="toggle-review" aria-label="راجعت: ${f.label}">راجعت ${svg(IC.check, 'ic-sm')}</button>`);
    return `<div class="fv" data-state="${f.state}" data-r="${r.id}" data-f="${idx}" data-p="${f.p}" style="--i:${k}" tabindex="0">
      <span class="fv-label" data-pn="${f.p + 1}">${warn ? svg(IC.alert, 'ic-sm') : ''}${f.label}</span>
      <span class="fv-value">${f.value}</span>${btn}</div>`;
  }
  function renderCard(r) {
    const [d, t] = counts(r);
    const fields = r.fields.map((f, idx) => fvHTML(r, f, idx, idx)).join('');
    const principles = r.fields.filter(f => f.k === 'principle'); const statutes = r.fields.filter(f => f.k === 'statute');
    const chips = (arr, empty) => arr.length ? `<div class="plist">${arr.map(f => `<span class="chip">${f.value}<span class="n">¶${f.p + 1}</span></span>`).join('')}</div>` : `<div class="plist" style="color:var(--fg-3)">${empty}</div>`;
    const has = new Set(r.fields.map(f => f.p));
    const paras = r.paras.map((txt, i) => `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}" data-has="${has.has(i) ? 1 : 0}"><span class="pnum">${String(i + 1).padStart(2, '0')}</span>${txt}</p>`).join('');
    return `<div class="bar" id="head">
        <button class="btn btn-ghost btn-icon back-btn" data-action="show-list" aria-label="القائمة">${svg(IC.back)}</button>
        ${stamp(r, 'md', true)}
        <h1>${r.title}</h1>
        <span id="rc-badge">${badge(r)}</span>
        <span class="num lbl" id="rc-count" style="font-size:11px;color:var(--fg-3);white-space:nowrap">${d} من ${t} مراجَع</span>
        <button class="btn btn-ghost" data-action="summarize">${svg(IC.sum)}<span class="lbl">لخّص</span></button>
        <button class="btn btn-ghost" data-action="compare">${svg(IC.compare)}<span class="lbl">قارن</span></button>
        <button class="btn btn-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check)}<span class="lbl">راجعت الكل</span></button>
        <button class="btn btn-ghost btn-icon as-btn" data-action="assist" aria-label="المساعد" aria-pressed="false">${svg(IC.msg)}</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="fields" aria-selected="${TAB.key === 'fields'}">الحقول <span class="n">${r.fields.length}</span></button>
        <button class="tab" role="tab" data-tab="principles" aria-selected="${TAB.key === 'principles'}">المبادئ <span class="n">${principles.length}</span></button>
        <button class="tab" role="tab" data-tab="statutes" aria-selected="${TAB.key === 'statutes'}">النصوص <span class="n">${statutes.length}</span></button>
      </div>
      <div class="grid-wrap">
        <div class="tabpanel" data-panel="fields" ${TAB.key !== 'fields' ? 'hidden' : ''}><div class="fgrid">${fields}</div></div>
        <div class="tabpanel" data-panel="principles" ${TAB.key !== 'principles' ? 'hidden' : ''}>${chips(principles, 'لا مبادئ مستخرجة')}</div>
        <div class="tabpanel" data-panel="statutes" ${TAB.key !== 'statutes' ? 'hidden' : ''}>${chips(statutes, 'لا نصوص مستخرجة — أضف نصاً')}</div>
      </div>
      <div class="text" aria-label="نص الحكم">
        <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
        ${paras}
      </div>`;
  }
  function renderList() { return `<div class="bar" id="head"><h1>اختر حكماً من القائمة</h1><button class="btn btn-ghost btn-icon as-btn" data-action="assist" aria-label="المساعد">${svg(IC.msg)}</button></div><div class="empty">القائمة على اليمين — افتح أي حكم لعرضه هنا.</div>`; }
  function listPane() {
    const pending = ORDER.filter(id => { const [d, t] = counts(R[id]); return d < t; }).length;
    return `<div class="pane-head">${svg(IC.rulings)}الأحكام <span class="cnt num">${ORDER.length}</span><span class="cnt" style="margin-inline-start:auto;font-size:12px">${pending} بانتظار المراجعة</span></div>
      <label class="search">${svg(IC.search, 'ic-sm')}<input type="search" placeholder="ابحث بالرقم أو الموضوع" aria-label="ابحث في الأحكام"><span class="kbd">/</span></label>
      <div class="rows" id="rows">${ORDER.map(id => rowHTML(id)).join('')}</div>`;
  }
  function rowHTML(id) {
    const r = R[id]; const [d, t] = counts(r); const dispute = (r.fields.find(f => f.k === 'dispute') || {}).value || '';
    return `<div class="row" tabindex="0" data-open="${id}" ${S.view === 'card' && S.rid === id ? 'aria-current="true"' : ''} aria-label="افتح ${r.title}">
      <div class="row-no">${stamp(r, 'sm', S.view !== 'card' || S.rid !== id)}<span>${r.date}</span></div>
      <div class="row-title">${r.title}</div>
      <div class="row-sub">${dispute} · ${r.kind}</div>
      <div class="row-rev"><span class="ring" style="--pct:${t ? d / t : 0}" aria-label="${d} من ${t} مراجَع"><i class="num">${d}/${t}</i></span></div>
    </div>`;
  }
  function shell() {
    const dark = document.documentElement.dataset.theme === 'dark';
    return `<div class="app" id="app">
      <nav class="rail" aria-label="التنقّل">
        <span class="rail-mark" aria-hidden="true">ق</span>
        ${NAV.map(([k, l]) => `<button data-action="nav" data-to="${k}" aria-label="${l}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${svg(IC[k])}<span class="tip">${l}</span></button>`).join('')}
        <div class="rail-foot"><button data-action="theme" aria-label="${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}" id="theme-btn">${svg(dark ? IC.sun : IC.moon)}<span class="tip">${dark ? 'فاتح' : 'داكن'}</span></button></div>
      </nav>
      <aside class="pane" id="pane" aria-label="قائمة الأحكام">${listPane()}</aside>
      <main class="detail" id="main">${S.view === 'card' ? renderCard(R[S.rid]) : renderList()}</main>
      <aside class="assist" id="assist" aria-label="المساعد">
        <div class="as-head">${svg(IC.msg)}المساعد<span class="as-ctx" id="as-ctx">${ctxText()}</span><button class="btn btn-ghost btn-icon" data-action="assist" aria-label="أغلق">${svg(IC.x)}</button></div>
        <div class="as-log" id="as-log" role="log">${assistEmptyHTML()}</div>
        <div class="as-tools"><button class="btn btn-secondary" data-action="draft">افحص مسودة</button></div>
        <form class="as-form" id="as-form"><label class="sr-only" for="as-input">اسأل</label><textarea id="as-input" rows="1" placeholder="اسأل عن أحكامك…"></textarea><button type="submit" class="btn btn-primary btn-icon" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button></form>
      </aside>
    </div>`;
  }
  function syncRows() { $$('.row', $('#pane')).forEach(el => { const cur = S.view === 'card' && el.dataset.open === S.rid; el.toggleAttribute('aria-current', cur); if (cur) el.setAttribute('aria-current', 'true'); }); $('#app')?.classList.remove('show-list'); const rows = $('#rows'); if (rows) rows.innerHTML = ORDER.map(id => rowHTML(id)).join(''); }
  window.DESIGN = {
    key: 'mastara', shell, renderCard, renderList, fvHTML,
    afterView() { syncRows(); },
    beforeAsk() { $('#app')?.classList.add('assist-open'); },
    onAction(act, a) {
      if (act === 'show-list') { $('#app').classList.add('show-list'); return true; }
      return false;
    },
    onTheme(dark) { const b = $('#theme-btn'); if (b) { b.innerHTML = svg(dark ? IC.sun : IC.moon) + `<span class="tip">${dark ? 'فاتح' : 'داكن'}</span>`; } }
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    TAB.key = t.dataset.tab;
    $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    $$('.tabpanel').forEach(p => p.hidden = p.dataset.panel !== TAB.key);
  });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); $('.search input')?.focus(); } });
  document.addEventListener('input', e => { if (!e.target.closest('.search')) return; const q = e.target.value.trim(); $$('.row', $('#pane')).forEach(el => { el.hidden = q && !el.textContent.includes(q); }); });
  Q.initTheme(false);
  Q.mountAll();
})();
</script>
</body>
</html>
