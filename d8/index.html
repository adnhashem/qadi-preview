<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>المجلّد — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== المجلّد — ملف ورقي ملوّن: تبويبات فاصلة، أقسام الحكم، ملاحظات لاصقة باستيل ===== */
:root {
  color-scheme: light;
  --desk: #e9e3d8; --folder: #fff9ee; --folder-2: #fdf3dc; --tab: #f4e4b8;
  --fg: #2a2520; --fg-2: #5e564c; --fg-3: #8c8378; --line: #e6dcc9; --line-2: #cdbf9f;
  --sage: #cfe7d6; --sage-d: #2f6b4a; --sky: #d6e6f7; --sky-d: #2b5a8f; --blush: #f7d9d9; --blush-d: #9b3b3b; --sand: #f6e6bf; --sand-d: #8a6400; --lilac: #e6ddf5; --lilac-d: #5b3f8f; --mint: #d9f0ea; --mint-d: #246b5c;
  --accent: #2f6b4a; --unrev: #b4541a;
  --font-ui: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-reading: 'Noto Naskh Arabic', serif;
  --r: 14px; --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 150ms; --mid: 300ms;
}
:root[data-theme="dark"] { color-scheme: dark; --desk: #1c1a17; --folder: #262220; --folder-2: #2e2926; --tab: #3a3128; --fg: #f1ebe2; --fg-2: #c4bbae; --fg-3: #8c8378; --line: #3b352f; --line-2: #55493c; --sage: #27402f; --sage-d: #9fd9b3; --sky: #233447; --sky-d: #9ec4ee; --blush: #442a2a; --blush-d: #f0a5a5; --sand: #453a1d; --sand-d: #f1cf6a; --lilac: #332a45; --lilac-d: #cdb8f2; --mint: #1f3a35; --mint-d: #9fe0cf; --accent: #9fd9b3; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; } .ic-sm { width: 14px; height: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 120px; }
.topline { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--folder); display: grid; place-items: center; }
.topline .sp { flex: 1; }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: var(--folder); border-radius: 10px; color: var(--fg-2); cursor: pointer; }

/* ---------- folder tabs ---------- */
.tabs { display: flex; gap: 4px; padding: 0 8px; overflow-x: auto; }
.tabs button { height: 42px; padding: 0 18px; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--tab); color: var(--fg-2); font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 14px; transition: transform var(--fast) var(--ease), background-color var(--fast); position: relative; top: 1px; }
.tabs button:hover { transform: translateY(-2px); }
.tabs button[aria-current] { background: var(--folder); color: var(--fg); height: 46px; top: 1px; z-index: 2; }
.folder { background: var(--folder); border: 1px solid var(--line-2); border-radius: 0 0 var(--r) var(--r); box-shadow: 0 2px 0 var(--line-2), 0 10px 30px rgb(60 40 10 / .12); padding: 26px 28px 40px; min-height: 60vh; position: relative; }

/* ---------- card: sections ---------- */
.rhead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
.rhead h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; flex: 1; min-width: 16rem; }
.label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; background: var(--folder-2); border: 1px dashed var(--line-2); font-size: 13px; font-weight: 600; }
.stamp { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--folder); }
.stamp > span { padding: 3px 9px; } .stamp > span + span { border-inline-start: 1px solid var(--line-2); }
.meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--fg-3); margin-bottom: 16px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.badge .ic { width: 12px; height: 12px; }
.badge-ok { background: var(--sage); color: var(--sage-d); } .badge-warn { background: var(--sand); color: var(--sand-d); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--folder-2); color: var(--fg); font-size: 13.5px; font-weight: 600; cursor: pointer; transition: transform var(--fast), background-color var(--fast); }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: var(--folder); }
.btn-ghost { background: none; color: var(--fg-2); }
.btn-secondary { background: var(--sky); color: var(--sky-d); }
.btn-icon { width: 38px; padding: 0; justify-content: center; }
.crumb { background: none; border: 0; padding: 0; color: var(--fg-3); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 14px; font-size: 13px; }
.crumb:hover { color: var(--accent); }

.sections { display: grid; gap: 18px; }
.sec { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; }
.sec-tab { position: sticky; top: 16px; align-self: start; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; }
.sec-tab small { display: block; font-weight: 500; font-size: 11px; opacity: .8; }
.sec[data-c="sky"] .sec-tab { background: var(--sky); color: var(--sky-d); }
.sec[data-c="sand"] .sec-tab { background: var(--sand); color: var(--sand-d); }
.sec[data-c="lilac"] .sec-tab { background: var(--lilac); color: var(--lilac-d); }
.sec[data-c="sage"] .sec-tab { background: var(--sage); color: var(--sage-d); }
.sec-body { display: grid; gap: 10px; }
.para { margin: 0; padding: 12px 16px; font-family: var(--font-reading); font-size: 17.5px; line-height: 2; background: var(--folder-2); border-radius: 12px; border: 1px solid transparent; transition: border-color var(--fast), background-color var(--fast); }
.para:hover, .para.lit, .para.flash { border-color: var(--line-2); background: var(--tab); }
.pnum { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); margin-inline-end: 8px; }
.notes { display: flex; flex-wrap: wrap; gap: 8px; }
.fv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 12px; border-radius: 10px; cursor: pointer; min-width: 180px; transform: rotate(var(--rot, 0deg)); transition: transform var(--fast) var(--ease), box-shadow var(--fast); box-shadow: 0 1px 2px rgb(60 40 10 / .12); }
.fv:hover, .fv.lit { transform: rotate(0) translateY(-2px); box-shadow: 0 6px 16px rgb(60 40 10 / .16); }
.fv:nth-child(odd) { --rot: -.6deg; } .fv:nth-child(even) { --rot: .5deg; }
.fv[data-k="principle"] { background: var(--sage); color: var(--sage-d); }
.fv[data-k="statute"] { background: var(--lilac); color: var(--lilac-d); }
.fv[data-k="nyaba"], .fv[data-k="prior"] { background: var(--sky); color: var(--sky-d); }
.fv[data-k="disposition"], .fv[data-k="winner"], .fv[data-k="costs"] { background: var(--mint); color: var(--mint-d); }
.fv[data-k="dispute"], .fv[data-k="parties"], .fv[data-k="circuit"], .fv[data-k="date"] { background: var(--sand); color: var(--sand-d); }
.fv[data-state="warn"] { background: var(--blush); color: var(--blush-d); }
.fv-label { grid-column: 1; font-size: 11px; font-weight: 700; opacity: .85; display: flex; align-items: center; gap: 4px; }
.fv-value { grid-column: 1; font-size: 14px; font-weight: 600; }
.fv[data-state="unreviewed"] .fv-label::after { content: "— لم يُراجَع"; font-weight: 500; }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 26px; padding: 0 9px; border: 1.5px solid currentColor; border-radius: 999px; background: rgb(255 255 255 / .5); font-size: 11px; font-weight: 700; cursor: pointer; opacity: 0; transition: opacity var(--fast); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: inherit; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border: 0; background: none; padding-inline: 0; }
@media (hover: none) { .fv-btn { opacity: 1; } }
.summary { padding: 14px 18px; border-radius: 12px; background: var(--mint); color: var(--fg); font-size: 14.5px; line-height: 1.9; margin-bottom: 18px; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); font-weight: 700; }
.ai-label .ic { width: 13px; height: 13px; }
.cite { display: inline-flex; align-items: center; margin-inline: 2px; padding: 0 7px; border: 0; border-radius: 999px; background: var(--sage); color: var(--sage-d); font-size: 11.5px; font-weight: 700; line-height: 1.7; cursor: pointer; vertical-align: baseline; }
.cite.unrev { background: var(--sand); color: var(--sand-d); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--fg-3); margin-bottom: 18px; }
.progress .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--folder-2); overflow: hidden; }
.progress .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transform: scaleX(var(--pct, 0)); transform-origin: right; transition: transform var(--mid) var(--ease); }

/* ---------- list ---------- */
.lhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.lhead h1 { margin: 0; font-size: 26px; font-weight: 700; }
.lhead .cnt { color: var(--fg-3); font-size: 13px; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.file { position: relative; padding: 40px 16px 16px; border-radius: 12px; background: var(--folder-2); border: 1px solid var(--line); cursor: pointer; display: grid; gap: 6px; transition: transform var(--fast) var(--ease), box-shadow var(--fast); }
.file::before { content: attr(data-c-label); position: absolute; top: -1px; inset-inline-start: 14px; padding: 4px 12px; border-radius: 0 0 8px 8px; font-size: 11px; font-weight: 700; background: var(--c-bg); color: var(--c-fg); }
.file:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgb(60 40 10 / .14); }
.file .t { font-weight: 700; font-size: 15px; line-height: 1.4; }
.file .s { font-size: 12.5px; color: var(--fg-2); }
.file .f { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-3); margin-top: 4px; }

/* ---------- assistant bubble + sheet ---------- */
.bubble { position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 30; height: 56px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--folder); font-weight: 700; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 28px rgb(47 107 74 / .35); transition: transform var(--fast); }
.bubble:hover { transform: translateY(-2px); }
.assist { position: fixed; bottom: 92px; inset-inline-end: 24px; z-index: 30; width: min(420px, calc(100vw - 32px)); height: min(560px, calc(100dvh - 120px)); display: flex; flex-direction: column; background: var(--folder); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: 0 20px 60px rgb(60 40 10 / .25); transform: translateY(16px) scale(.98); opacity: 0; visibility: hidden; transition: transform var(--mid) var(--ease), opacity var(--mid) var(--ease), visibility 0s linear var(--mid); }
.app.assist-open .assist { transform: none; opacity: 1; visibility: visible; transition: transform var(--mid) var(--ease), opacity var(--mid) var(--ease); }
.as-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; }
.as-ctx { margin-inline-start: auto; font-size: 11px; color: var(--fg-3); font-weight: 500; }
.as-log { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.as-intro { margin: 0 0 6px; color: var(--fg-2); font-size: 13.5px; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg button { text-align: start; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--folder-2); font-size: 13px; font-weight: 600; cursor: pointer; }
.sugg button:hover { background: var(--tab); }
.msg-user { align-self: flex-end; max-width: 85%; padding: 8px 12px; background: var(--sky); color: var(--sky-d); border-radius: 14px 14px 2px 14px; font-size: 13.5px; font-weight: 600; }
.msg-ai { font-size: 14px; line-height: 1.85; padding: 10px 12px; background: var(--folder-2); border-radius: 14px 14px 14px 2px; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 13px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 900ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 11px; margin-top: 4px; }
.ai-actions { margin-top: 8px; }
.as-tools { padding: 0 16px 8px; }
.as-form { display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
.as-form textarea { flex: 1; resize: none; field-sizing: content; min-height: 38px; max-height: 6rem; padding: 8px 14px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--folder-2); font-size: 13.5px; line-height: 1.5; }

/* ---------- compare ---------- */
.cmp { width: min(680px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line-2); border-radius: 20px; background: var(--folder); color: var(--fg); box-shadow: 0 20px 60px rgb(60 40 10 / .3); }
.cmp::backdrop { background: rgb(42 37 32 / .4); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cmp-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.cmp-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 12px 18px; font-size: 13px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 1px; cursor: pointer; }
.cmp-pick button[aria-pressed="true"] .stamp { background: var(--sage); color: var(--sage-d); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp-tbl th, .cmp-tbl td { padding: 10px 18px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 12px; width: 22%; font-weight: 700; }
.cmp-tbl tr[data-diff="yes"] td:last-child { background: var(--sand); color: var(--sand-d); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 700; }
.cmp-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 18px; border-top: 1px solid var(--line); }
.toasts { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 999px; background: var(--fg); color: var(--folder); font-size: 13px; font-weight: 600; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 12px; inset-inline-start: 12px; z-index: 40; font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-radius: 999px; background: var(--folder); border: 1px solid var(--line); }

@media (max-width: 760px) {
  .page { padding: 14px 10px 120px; }
  .folder { padding: 18px 14px 30px; }
  .sec { grid-template-columns: minmax(0, 1fr); }
  .sec-tab { position: static; }
  .rhead h1 { font-size: 22px; }
  .para { font-size: 16.5px; }
  .bubble span { display: none; } .bubble { padding: 0 16px; }
  .assist { inset-inline: 10px; bottom: 90px; width: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; } .fv { transform: none; } }
</style>
</head>
<body>
<a class="hub-link" href="../">← التصاميم</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, counts, badge, stamp, assistEmptyHTML, ctxText, $, $$ } = Q;
  const g = (r, k) => (r.fields.find(f => f.k === k) || {}).value || '';
  function fvHTML(r, f, idx, k) {
    const warn = f.state === 'warn';
    const btn = warn ? '' : (f.state === 'reviewed'
      ? `<button class="fv-btn" data-action="toggle-review" aria-label="ألغِ المراجعة: ${f.label}">${svg(IC.check, 'ic-sm')}مراجَع</button>`
      : `<button class="fv-btn" data-action="toggle-review" aria-label="راجعت: ${f.label}">راجعت</button>`);
    return `<div class="fv" data-state="${f.state}" data-k="${f.k}" data-r="${r.id}" data-f="${idx}" data-p="${f.p}" style="--i:${k}" tabindex="0">
      <span class="fv-label">${warn ? svg(IC.alert, 'ic-sm') : ''}${f.label}</span><span class="fv-value">${f.value}</span>${btn}</div>`;
  }
  function sectionsOf(r) {
    const n = r.paras.length; const idx = [...Array(n).keys()];
    if (n >= 6) return [['الديباجة', 'sky', idx.slice(0, 2)], ['الوقائع', 'sand', idx.slice(2, 5)], ['الأسباب', 'lilac', idx.slice(5, n - 1)], ['المنطوق', 'sage', [n - 1]]];
    return [['الديباجة', 'sky', [0]], ['الوقائع والأسباب', 'lilac', idx.slice(1, n - 1)], ['المنطوق', 'sage', [n - 1]]];
  }
  function renderCard(r) {
    const [d, t] = counts(r);
    const secs = sectionsOf(r).map(([name, c, ps]) => `<div class="sec" data-c="${c}"><div class="sec-tab">${name}<small>${ps.length > 1 ? `الفقرات ${ps[0] + 1}–${ps[ps.length - 1] + 1}` : `الفقرة ${ps[0] + 1}`}</small></div><div class="sec-body">${ps.map(i => { const fs = r.fields.map((f, idx) => [f, idx]).filter(([f]) => f.p === i);
      return `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}"><span class="pnum num">${i + 1}</span>${r.paras[i]}</p>${fs.length ? `<div class="notes">${fs.map(([f, idx]) => fvHTML(r, f, idx, idx)).join('')}</div>` : ''}`; }).join('')}</div></div>`).join('');
    return `<div class="folder" id="head">
      <button class="crumb" data-action="list">${svg(IC.back, 'ic-sm')} كل الملفات</button>
      <div class="rhead"><h1>${r.title}</h1><span class="label">${stamp(r, 'sm', true)}</span></div>
      <div class="meta"><span>${r.kind}</span><span>·</span><span class="num">${r.date}</span><span id="rc-badge">${badge(r)}</span></div>
      <div class="actions">
        <button class="btn btn-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check, 'ic-sm')}راجعت الكل</button>
        <button class="btn" data-action="summarize">${svg(IC.sum, 'ic-sm')}لخّص</button>
        <button class="btn" data-action="compare">${svg(IC.compare, 'ic-sm')}قارن مع…</button>
        <button class="btn btn-ghost" data-action="assist">${svg(IC.msg, 'ic-sm')}اسأل عنه</button>
      </div>
      <div class="progress"><span class="num" id="rc-count">${d} من ${t} مراجَع</span><div class="bar" id="rc-pct" style="--pct:${t ? d / t : 0}"><i></i></div></div>
      <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
      <div class="sections">${secs}</div>
    </div>`;
  }
  const CLR = { 'إداري/2': ['sky', 'إداري'], 'تجاري/2': ['lilac', 'تجاري'] };
  function renderList() {
    const pending = ORDER.filter(id => { const [d, t] = counts(R[id]); return d < t; }).length;
    const files = ORDER.map(id => { const r = R[id]; const [d, t] = counts(r); const [c, lbl] = CLR[r.circuit] || ['sand', r.circuit];
      return `<div class="file" tabindex="0" data-open="${id}" data-c-label="${lbl} · ${r.year}" style="--c-bg:var(--${c});--c-fg:var(--${c}-d)" aria-label="افتح ${r.title}"><div class="t">${r.title}</div><div class="s">${g(r, 'dispute')} · ${r.kind}</div><div class="f"><span class="num">${r.no}/${r.year} · ${r.date}</span>${badge(r)}</div><div class="progress" style="margin:4px 0 0"><div class="bar"><i style="--pct:${t ? d / t : 0}"></i></div><span class="num">${d}/${t}</span></div></div>`; }).join('');
    return `<div class="folder" id="head"><div class="lhead"><h1>ملفات الأحكام</h1><span class="cnt"><span class="num">${ORDER.length}</span> ملفات · <span class="num">${pending}</span> بانتظار المراجعة</span></div><div class="files">${files}</div></div>`;
  }
  function shell() {
    const dark = document.documentElement.dataset.theme === 'dark';
    return `<div class="app" id="app"><div class="page">
      <div class="topline"><div class="brand"><span class="brand-mark" aria-hidden="true">ق</span>نظام القاضي</div><span class="sp"></span><button class="ib" data-action="theme" id="theme-btn" aria-label="${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}">${svg(dark ? IC.sun : IC.moon)}</button></div>
      <nav class="tabs" aria-label="التنقّل">${NAV.map(([k, l]) => `<button data-action="nav" data-to="${k}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
      <main id="main">${S.view === 'card' ? renderCard(R[S.rid]) : renderList()}</main>
    </div>
    <button class="bubble" data-action="assist" aria-expanded="false">${svg(IC.msg)}<span>اسأل أحكامك</span></button>
    <section class="assist" aria-label="المساعد">
      <div class="as-head">${svg(IC.spark)}المساعد<span class="as-ctx" id="as-ctx">${ctxText()}</span><button class="btn btn-icon btn-ghost" data-action="assist" aria-label="أغلق">${svg(IC.x)}</button></div>
      <div class="as-log" id="as-log" role="log">${assistEmptyHTML()}</div>
      <div class="as-tools"><button class="btn btn-secondary" data-action="draft">افحص مسودة</button></div>
      <form class="as-form" id="as-form"><label class="sr-only" for="as-input">اسأل</label><textarea id="as-input" rows="1" placeholder="اسأل عن أحكامك…"></textarea><button type="submit" class="btn btn-primary btn-icon" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button></form>
    </section></div>`;
  }
  window.DESIGN = {
    key: 'mujallad', shell, renderCard, renderList, fvHTML,
    beforeAsk() { $('#app')?.classList.add('assist-open'); },
    onTheme(dark) { const b = $('#theme-btn'); if (b) b.innerHTML = svg(dark ? IC.sun : IC.moon); }
  };
  Q.initTheme(false);
  Q.mountAll();
})();
</script>
</body>
</html>
