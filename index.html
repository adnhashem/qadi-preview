<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>نظام القاضي — نموذج التصميم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens — من design-plan.md §17 ============ */
:root {
  color-scheme: light;
  --color-paper-50:  oklch(0.975 0.008 80);
  --color-paper-100: oklch(0.955 0.012 80);
  --color-paper-200: oklch(0.920 0.016 80);
  --color-surface:   oklch(0.990 0.005 80);
  --color-ink-900: oklch(0.22 0.020 260);
  --color-ink-700: oklch(0.40 0.020 260);
  --color-ink-600: oklch(0.48 0.020 260);
  --color-ink-500: oklch(0.56 0.015 260);
  --color-ink-300: oklch(0.80 0.010 260);
  --color-ink-200: oklch(0.88 0.008 260);
  --color-accent-700: oklch(0.42 0.11 50);
  --color-accent-600: oklch(0.50 0.12 50);
  --color-accent-500: oklch(0.58 0.13 50);
  --color-accent-300: oklch(0.78 0.09 55);
  --color-accent-100: oklch(0.94 0.03 60);
  --color-success-600: oklch(0.47 0.12 150);
  --color-warning-600: oklch(0.52 0.12 75);
  --color-danger-600:  oklch(0.48 0.17 25);

  --dark-bg:      oklch(0.16 0.012 260);
  --dark-surface: oklch(0.20 0.014 260);
  --dark-raised:  oklch(0.24 0.016 260);
  --dark-text:    oklch(0.92 0.010 80);
  --dark-text-2:  oklch(0.74 0.010 80);
  --dark-accent:  oklch(0.76 0.100 55);
  --dark-success: oklch(0.72 0.12 150);
  --dark-warning: oklch(0.80 0.13 80);

  --bg:          light-dark(var(--color-paper-50),  var(--dark-bg));
  --page-bg:     light-dark(var(--color-paper-200), oklch(0.13 0.01 260));
  --surface:     light-dark(var(--color-surface),   var(--dark-surface));
  --surface-2:   light-dark(var(--color-paper-100), var(--dark-raised));
  --fg:          light-dark(var(--color-ink-900),   var(--dark-text));
  --fg-2:        light-dark(var(--color-ink-700),   var(--dark-text-2));
  --fg-label:    light-dark(var(--color-ink-600),   var(--dark-text-2));
  --border:      light-dark(var(--color-ink-200),   var(--dark-raised));
  --border-strong: light-dark(var(--color-ink-600), var(--dark-text-2));
  --accent:      light-dark(var(--color-accent-600), var(--dark-accent));
  --accent-hover: light-dark(var(--color-accent-500), var(--dark-accent));
  --accent-text: light-dark(var(--color-accent-700), var(--dark-accent));
  --accent-soft: light-dark(var(--color-accent-100), oklch(0.28 0.04 55));
  --accent-line: light-dark(var(--color-accent-300), oklch(0.50 0.07 55));
  --on-accent:   light-dark(var(--color-surface),   var(--dark-bg));
  --success: light-dark(var(--color-success-600), var(--dark-success));
  --warning: light-dark(var(--color-warning-600), var(--dark-warning));

  --mark-unreviewed: 1px dashed var(--accent);
  --mark-reviewed:   1px solid var(--border);

  --font-ui:      'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif;
  --font-reading: 'Noto Naskh Arabic', 'IBM Plex Sans Arabic', serif;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem;
  --text-reading: 1.125rem; --text-lg: 1.25rem; --text-xl: 1.5625rem;
  --text-2xl: 1.953rem;
  --leading-ui: 1.6; --leading-reading: 1.8; --leading-tight: 1.3;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --space-12: 48px; --space-16: 64px;
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px;
  --shadow-raised: 0 1px 2px oklch(0.16 0.02 260 / 0.08), 0 8px 24px oklch(0.16 0.02 260 / 0.10);
  --row-h: 40px; --row-h-sm: 28px; --row-h-comfort: 48px;
  --nav-w: 240px; --nav-w-collapsed: 64px;
  --assist-w: 360px; --assist-w-md: 320px;
  --col-text: 68ch; --col-margin: 20rem; --col-margin-md: 16rem; --gap-margin: var(--space-6);
  --sticky-h: 56px; --dialog-w: 600px; --sheet-h: 60vh;
  --icon-sm: 16px; --icon-md: 20px;
  --focus-ring: 3px solid var(--accent); --focus-offset: 2px;

  --ease-standard:   cubic-bezier(0.4, 0, 0.2, 1);
  --ease-decelerate: cubic-bezier(0, 0, 0.2, 1);
  --ease-accelerate: cubic-bezier(0.4, 0, 1, 1);
  --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);
  --duration-fast: 150ms; --duration-normal: 250ms; --duration-slow: 400ms;
  --stagger: 50ms;
}
:root[data-theme="dark"] { color-scheme: dark; }

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: var(--text-base); line-height: var(--leading-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.ic { width: var(--icon-md); height: var(--icon-md); flex: none; }
.ic-sm { width: var(--icon-sm); height: var(--icon-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: var(--row-h); padding: 0 var(--space-4);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: none; cursor: pointer; white-space: nowrap;
  font-size: var(--text-sm); font-weight: 500;
  transition: background-color var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard),
              color var(--duration-fast) var(--ease-standard),
              transform 100ms var(--ease-standard);
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { border-color: var(--accent); color: var(--accent-text); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn-icon { width: var(--row-h); padding: 0; justify-content: center; }

/* ============ Stamp (بصمة ٢) ============ */
.stamp {
  display: inline-flex; align-items: stretch; flex: none;
  border: 1px solid var(--accent-line); border-radius: var(--radius-xs);
  background: var(--surface); color: var(--accent-text);
  font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
}
.stamp > span { display: flex; align-items: center; padding: var(--space-1) var(--space-2); }
.stamp > span + span { border-inline-start: 1px solid var(--accent-line); }
.stamp-sm { font-size: var(--text-xs); }
.stamp-md { font-size: var(--text-sm); }
.stamp-md > span { padding: var(--space-2) var(--space-3); }

/* ============ Badge ============ */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 0 var(--space-2); border: 1px solid currentColor; border-radius: var(--radius-sm);
  font-size: var(--text-xs); font-weight: 500; line-height: 1.8;
}
.badge .ic { width: 14px; height: 14px; }
.badge-warn { color: var(--warning); }
.badge-ok { color: var(--success); }

/* ============ Shell ============ */
.app {
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--assist-w);
  height: 100dvh; overflow: hidden; background: var(--bg);
}
.nav {
  display: flex; flex-direction: column; gap: var(--space-1);
  padding: var(--space-4) var(--space-3);
  border-inline-end: 1px solid var(--border); min-height: 0;
}
.brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-6); }
.brand-mark {
  width: 32px; height: 32px; display: grid; place-items: center; flex: none;
  border: 1px solid var(--accent-line); border-radius: var(--radius-xs);
  color: var(--accent-text); font-family: var(--font-reading); font-weight: 700; font-size: var(--text-lg); line-height: 1;
}
.brand-name { font-weight: 600; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; height: var(--row-h); padding: 0 var(--space-3);
  border: 0; border-inline-start: 3px solid transparent; border-radius: var(--radius-sm);
  background: none; color: var(--fg-2); cursor: pointer; text-align: start; font-size: var(--text-sm);
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item[aria-current] { color: var(--fg); background: var(--surface); border-inline-start-color: var(--accent); font-weight: 500; }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); }
.demo-note { font-size: var(--text-xs); color: var(--fg-label); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); line-height: 1.6; }

.main { overflow: auto; min-height: 0; position: relative; scroll-padding-block-start: calc(var(--head-h, 140px) + var(--space-4)); }

/* ============ Card header ============ */
.rc-head, .list-head {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: var(--space-3) var(--space-8) var(--space-4);
}
.rc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
.back { padding-inline: var(--space-2); margin-inline-start: calc(-1 * var(--space-2)); }
.assist-toggle { display: none; }
.rc-row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.rc-titles { flex: 1; min-width: 14rem; }
.rc-titles h1 { margin: 0; font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); text-wrap: balance; }
.rc-meta { margin: var(--space-1) 0 0; color: var(--fg-label); font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.rc-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.rc-count { font-size: var(--text-sm); color: var(--fg-2); font-variant-numeric: tabular-nums; margin-inline-end: var(--space-2); }

/* ============ Marginalia (بصمة ١) — تنفيذ B: صف لكل فقرة ============ */
.marg {
  display: grid;
  grid-template-columns: minmax(0, var(--col-text)) var(--col-margin);
  column-gap: var(--gap-margin);
  padding: var(--space-8);
}
.row { display: contents; }
.para {
  margin: 0; padding: var(--space-3) var(--space-4);
  font-family: var(--font-reading); font-size: var(--text-reading); line-height: var(--leading-reading);
  border-radius: var(--radius-sm);
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-normal) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.para.lit, .para.flash { background: var(--accent-soft); }
.pnum {
  display: inline-block; min-width: 1.5em; margin-inline-end: var(--space-2);
  font-family: var(--font-ui); font-size: var(--text-xs); color: var(--fg-label); font-variant-numeric: tabular-nums;
}
.notes { padding-block: var(--space-3); min-width: 0; }
.notes-inner { position: sticky; top: calc(var(--head-h, 140px) + var(--space-3)); display: flex; flex-direction: column; gap: var(--space-2); }

/* ============ FieldValue (بصمة ٣ — نحو المراجعة) ============ */
.fv {
  display: grid; gap: 2px; justify-items: start;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard);
}
.fv:hover, .fv.lit { background: var(--surface-2); }
.fv-label { display: flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); font-weight: 500; color: var(--fg-label); }
.fv-value { font-size: var(--text-sm); color: var(--fg); padding-bottom: 1px; overflow-wrap: anywhere; }
.fv[data-state="unreviewed"] .fv-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.fv[data-state="unreviewed"] .fv-value { border-bottom: var(--mark-unreviewed); }
.fv[data-state="reviewed"] .fv-value { border-bottom: var(--mark-reviewed); }
.fv[data-state="warn"] { background: color-mix(in oklch, var(--warning) 9%, transparent); }
.fv[data-state="warn"] .fv-label { color: var(--warning); }
.fv-btn {
  display: inline-flex; align-items: center; gap: var(--space-1);
  height: var(--row-h-sm); margin-top: var(--space-1); padding: 0 var(--space-2);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--accent-text);
  font-size: var(--text-xs); font-weight: 500; cursor: pointer;
  opacity: 0; transition: opacity var(--duration-fast) var(--ease-standard), background-color var(--duration-fast);
}
.fv-btn:hover { background: var(--accent-soft); }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn, .fv:focus .fv-btn { opacity: 1; }
.fv[data-state="reviewed"] .fv-btn { border-color: transparent; background: none; color: var(--success); opacity: 1; padding-inline: 0; }
@media (hover: none) { .fv-btn { opacity: 1; } }

/* ============ Summary (زر لخّص — inline لا محادثة) ============ */
.summary {
  margin: var(--space-6) var(--space-8) 0; padding: var(--space-4) var(--space-5);
  max-width: calc(var(--col-text) + var(--col-margin) + var(--gap-margin));
  background: var(--surface); border: 1px solid var(--border); border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius-sm); font-size: var(--text-sm); line-height: 1.9;
}
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.ai-label { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); color: var(--fg-label); }
.ai-label .ic { width: 14px; height: 14px; }

/* ============ Cite ============ */
.cite {
  display: inline-flex; align-items: center; vertical-align: baseline;
  margin-inline: 2px; padding: 0 var(--space-1);
  border: 1px solid var(--accent-line); border-radius: var(--radius-xs);
  background: var(--surface); color: var(--accent-text);
  font-size: var(--text-xs); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.7; cursor: pointer;
  transition: background-color var(--duration-fast);
}
.cite:hover { background: var(--accent-soft); }
.cite.unrev { border-style: dashed; border-color: var(--accent); }

/* ============ List ============ */
.list-head { display: flex; align-items: flex-end; justify-content: space-between; padding-top: var(--space-6); }
.list-head h1 { margin: 0; font-size: var(--text-xl); font-weight: 600; }
.tbl-wrap { padding: 0 var(--space-8) var(--space-16); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th {
  position: sticky; top: var(--head-h, 90px); z-index: 2; background: var(--bg);
  text-align: start; font-size: var(--text-xs); font-weight: 500; color: var(--fg-label);
  padding: var(--space-3); border-bottom: 1px solid var(--border);
}
.tbl td { height: var(--row-h-comfort); padding: 0 var(--space-3); border-bottom: 1px solid var(--border); }
.tbl tbody tr { cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard); }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr:focus-visible { outline-offset: -3px; }
.t-subject { font-weight: 500; }
.t-sub2 { display: block; font-size: var(--text-xs); color: var(--fg-label); font-weight: 400; }

/* ============ Assistant ============ */
.assist { display: flex; flex-direction: column; min-height: 0; border-inline-start: 1px solid var(--border); background: var(--bg); }
.as-head { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); min-height: var(--sticky-h); border-bottom: 1px solid var(--border); }
.as-title { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; }
.as-ctx { margin-inline-start: auto; font-size: var(--text-xs); color: var(--fg-label); }
.as-close { display: none; }
.as-log { flex: 1; overflow: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.as-intro { margin: 0 0 var(--space-3); color: var(--fg-2); font-size: var(--text-sm); }
.sugg { display: flex; flex-direction: column; gap: var(--space-2); }
.sugg button {
  text-align: start; padding: var(--space-3); line-height: 1.6;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  font-size: var(--text-sm); cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast);
}
.sugg button:hover { border-color: var(--accent-line); background: var(--surface-2); }
.msg-user { align-self: flex-end; max-width: 85%; padding: var(--space-2) var(--space-3); background: var(--surface-2); border-radius: var(--radius-md); font-size: var(--text-sm); }
.msg-ai { font-size: var(--text-sm); line-height: 1.9; }
.ai-body { margin-top: var(--space-1); }
.thinking { display: flex; align-items: center; gap: var(--space-2); color: var(--fg-label); font-size: var(--text-sm); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 900ms var(--ease-standard) infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
.stopped { display: block; margin-top: var(--space-1); color: var(--fg-label); font-size: var(--text-xs); }
.ai-actions { margin-top: var(--space-2); }
.as-tools { padding: 0 var(--space-4) var(--space-2); }
.as-tools .btn { height: var(--row-h-sm); font-size: var(--text-xs); padding: 0 var(--space-3); }
.as-form { display: flex; gap: var(--space-2); align-items: flex-end; padding: var(--space-3) var(--space-4) var(--space-4); border-top: 1px solid var(--border); }
.as-form textarea {
  flex: 1; resize: none; field-sizing: content; min-height: var(--row-h); max-height: 8rem;
  padding: var(--space-2) var(--space-3); line-height: 1.5;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font-size: var(--text-sm);
}
.notice {
  padding: var(--space-3); font-size: var(--text-sm); line-height: 1.9;
  background: var(--surface); border: 1px solid var(--border); border-inline-start: 3px solid var(--warning); border-radius: var(--radius-sm);
  animation: rise var(--duration-normal) var(--ease-decelerate) both;
}
.notice p { margin: var(--space-1) 0 0; }

/* ============ Pipeline (حيّ) ============ */
.pipeline { display: none; }

/* ============ Toast ============ */
.toasts { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: var(--space-2); align-items: center; pointer-events: none; }
.toast {
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm);
  background: var(--fg); color: var(--bg); font-size: var(--text-sm); box-shadow: var(--shadow-raised);
  animation: rise var(--duration-normal) var(--ease-decelerate) both;
  transition: opacity var(--duration-fast) var(--ease-accelerate);
}
.toast.out { opacity: 0; }

/* ============ Compare dialog ============ */
.cmp {
  width: min(calc(var(--dialog-w) + 120px), calc(100vw - 2 * var(--space-4)));
  padding: 0; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow-raised);
  font-family: var(--font-ui);
  opacity: 0; transform: scale(.98);
  transition: opacity var(--duration-normal) var(--ease-decelerate), transform var(--duration-normal) var(--ease-decelerate),
              overlay var(--duration-normal) allow-discrete, display var(--duration-normal) allow-discrete;
}
.cmp[open] { opacity: 1; transform: none; }
@starting-style { .cmp[open] { opacity: 0; transform: scale(.98); } }
.cmp::backdrop { background: oklch(0.16 0.02 260 / .35); }
.cmp-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
.cmp-head h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; }
.cmp-pick { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; padding: var(--space-3) var(--space-5); font-size: var(--text-xs); color: var(--fg-label); }
.cmp-pick button { border: 0; background: none; padding: 2px; cursor: pointer; border-radius: var(--radius-xs); }
.cmp-pick button[aria-pressed="true"] .stamp { background: var(--accent-soft); border-color: var(--accent); }

function paraUnreviewed(rid, p) {

/* ===================== Mount / view ===================== */
function measureHead() {
  const h = $('#head'); const m = $('#main');
  if (h && m) m.style.setProperty('--head-h', h.offsetHeight + 'px');
}
let headRO = null;
function watchHead() {
  headRO?.disconnect();
  const h = $('#head'); if (!h || !window.ResizeObserver) return;
  headRO = new ResizeObserver(measureHead); headRO.observe(h);
}

function afterMount() {
  measureHead(); watchHead(); litKey = null;
  const app = $('#app');
  if (VARIANTS[S.variant] === 'live' && S.view === 'card') runPipeline();
  else if (app) app.classList.add('revealed');
}

function setView(view, rid, after) {
  const apply = () => {
    S.view = view; if (rid) S.rid = rid;
    $('#main').innerHTML = view === 'card' ? renderCard(R[S.rid]) : renderList();
    $('#main').scrollTop = 0;
    $('#as-ctx').textContent = ctxText();
    measureHead(); watchHead(); litKey = null;
    const app = $('#app'); app.classList.remove('analyzing'); app.classList.add('revealed');
  };
  const done = () => { if (after) requestAnimationFrame(after); };
  if (document.startViewTransition && !reduced()) {
    const vt = document.startViewTransition(apply);
    vt.finished.then(done, done);
  } else { apply(); done(); }
}

/* ===================== Pipeline (حيّ) ===================== */
function runPipeline() {
  const app = $('#app'); const pipe = $('#pipeline');
  if (!app || !pipe) return;
  if (reduced()) { app.classList.add('revealed'); return; }
  pipe.hidden = false;
  app.classList.remove('revealed'); app.classList.add('analyzing');
  const steps = $$('.step', pipe); const bar = $('.pipe-bar i', pipe);
  const paras = $$('.para', $('#main'));
  const setStep = (i) => {
    steps.forEach((s, j) => { s.classList.toggle('done', j < i); s.classList.toggle('active', j === i); });
    bar.style.setProperty('--prog', String(Math.min(i / steps.length, 1)));
  };
  setStep(0);
  later(() => setStep(1), 380);
  later(() => setStep(2), 760);
  paras.forEach((p, i) => {
    later(() => { p.classList.add('scanned', 'scanning'); later(() => p.classList.remove('scanning'), 160); }, 800 + i * 90);
  });
  const end = 800 + paras.length * 90 + 120;
  later(() => {
    setStep(3);
    app.classList.remove('analyzing'); app.classList.add('revealed');
    paras.forEach(p => p.classList.remove('scanned'));
  }, end);
  later(() => { pipe.hidden = true; addNotice(); }, end + 900);
}
function addNotice() {
  const log = $('#as-log'); if (!log || $('#notice')) return;
  const r = R[S.rid]; const [, t] = counts(r);
  const div = document.createElement('div');
  div.className = 'notice'; div.id = 'notice';
  div.innerHTML = `<span class="ai-label">${svg(IC.info)}مولَّد — راجع الاستشهادات</span>
    <p>اكتمل تحليل هذا الحكم: <span class="num">${t}</span> حقلاً ومبدآن، و<strong>تنبيه صياغة</strong> واحد ${citeHTML(r.id, 3)} — تاريخ مستحيل في سرد الوقائع.</p>`;
  log.prepend(div);
}

/* ===================== Highlight (بصمة ٥) ===================== */
function setLit(key) {
  if (key === litKey) return;
  const main = $('#main'); if (!main) return;
  $$('.lit', main).forEach(n => n.classList.remove('lit'));
  litKey = key;
  if (!key) return;
  const [rid, p] = key.split(':');
  $(`#${rid}-p${p}`)?.classList.add('lit');
  $$(`.fv[data-p="${p}"]`, main).forEach(n => n.classList.add('lit'));
}
function keyFrom(target) {
  const fv = target.closest?.('.fv'); if (fv) return `${fv.dataset.r}:${fv.dataset.p}`;
  const pa = target.closest?.('.para'); if (pa) return `${pa.dataset.r}:${pa.dataset.p}`;
  return null;
}
function focusPara(rid, p, flash) {
  const el = document.getElementById(`${rid}-p${p}`); if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' });
  if (flash) { el.classList.add('flash'); later(() => el.classList.remove('flash'), 1600); }
}
function gotoCite(rid, p) {
  if (S.view === 'card' && S.rid === rid) focusPara(rid, p, true);
  else setView('card', rid, () => focusPara(rid, p, true));
  if (matchMedia('(max-width: 1023px)').matches) $('#app')?.classList.remove('assist-open');
}

/* ===================== Review ===================== */
function refreshHeader() {
  const r = R[S.rid]; const [d, t] = counts(r);
  const c = $('#rc-count'); if (c) c.textContent = `${d} من ${t} مراجَع`;
  const b = $('#rc-badge'); if (b) b.innerHTML = badge(r);
  const ra = $('#review-all'); if (ra) ra.hidden = d === t;
}
function toggleReview(fvEl) {
  const r = R[fvEl.dataset.r]; const idx = +fvEl.dataset.f; const f = r.fields[idx];
  f.state = f.state === 'reviewed' ? 'unreviewed' : 'reviewed';
  const k = getComputedStyle(fvEl).getPropertyValue('--i');
  fvEl.outerHTML = fvHTML(r, f, idx, k || 0);
  const fresh = $(`.fv[data-r="${r.id}"][data-f="${idx}"]`);
  if (fresh) { fresh.style.animation = 'none'; fresh.querySelector('.fv-btn')?.focus(); }
  refreshHeader();
  announce(f.state === 'reviewed' ? `روجع: ${f.label}` : `أُلغيت مراجعة: ${f.label}`);
}
function reviewAll() {
  const r = R[S.rid];
  r.fields.forEach(f => { if (f.state === 'unreviewed') f.state = 'reviewed'; });
  $$('.fv', $('#main')).forEach(el => {
    const idx = +el.dataset.f; const k = getComputedStyle(el).getPropertyValue('--i');
    el.outerHTML = fvHTML(r, r.fields[idx], idx, k || 0);
  });
  $$('.fv', $('#main')).forEach(el => el.style.animation = 'none');
  refreshHeader();
  toast('روجعت كل الحقول');
}

};
function summaryFor(r) {
  if (r.id === 'R1') return [
    { t: 'طعن من الإدارة في حكم أيّد أحقية موظف في بدل التخصص' }, { c: ['R1', 3] },
    { t: '. ميّزت المحكمة وتصدّت ورفضت الدعوى' }, { c: ['R1', 7] },
    { t: '، لأن العبرة بمطابقة المؤهل للنص لا بالعمل الفعلي' }, { c: ['R1', 5] },
    { t: '، وصرف الإدارة السابق لا ينشئ حقاً' }, { c: ['R1', 6] }, { t: '.' }
  ];
  const g = k => (r.fields.find(f => f.k === k) || {}).value || '—';
  const last = r.paras.length - 1;
  return [{ t: `${g('dispute')}. انتهت المحكمة إلى ${g('disposition')}` }, { c: [r.id, last] }, { t: `، على أساس: ${g('principle')}` }, { c: [r.id, Math.max(last - 1, 0)] }, { t: '.' }];
}

function setSendMode(mode) {
  const b = $('#as-send'); if (!b) return;
  b.dataset.mode = mode;
  b.innerHTML = svg(mode === 'stop' ? IC.stop : IC.up);
  b.setAttribute('aria-label', mode === 'stop' ? 'أوقف' : 'أرسل');
}
function stopStream(userAction) {
  if (!streaming) return;
  const st = streaming; streaming = null;
  st.cancelled = true; clearTimeout(st.timer); clearTimeout(st.start);
  st.thinking?.remove();
  if (userAction) {
    const s = document.createElement('span'); s.className = 'stopped'; s.textContent = 'أُوقف — والنص الجزئي محفوظ.';
    (st.body || st.target).append(s);
    announce('أُوقف الجواب');
  }
  $('#as-log')?.setAttribute('aria-busy', 'false');
  setSendMode('send');
}
function stream(target, segs, onDone) {
  stopStream(false);
  const log = $('#as-log');
  log?.setAttribute('aria-busy', 'true');
  const st = { cancelled: false, target };
  streaming = st;
  setSendMode('stop');
  const thinking = document.createElement('div');
  thinking.className = 'thinking'; thinking.innerHTML = '<span class="pulse"></span>جارٍ البحث في أحكامك…';
  target.append(thinking); st.thinking = thinking;
  const tokens = [];
  segs.forEach(s => { if (s.t) s.t.split(/(\s+)/).forEach(w => w && tokens.push({ w })); else tokens.push(s); });
  let i = 0; let cites = 0;
  const scroll = () => { if (log && target.closest('#as-log')) log.scrollTop = log.scrollHeight; };
  const tick = () => {
    if (st.cancelled) return;
    if (i >= tokens.length) {
      streaming = null; log?.setAttribute('aria-busy', 'false'); setSendMode('send');
      announce(`وصل الجواب، ${cites} استشهادات`);
      onDone?.(st.body); return;
    }
    const tk = tokens[i++];
    if (tk.w) st.body.append(tk.w);
    else { st.body.insertAdjacentHTML('beforeend', ' ' + citeHTML(tk.c[0], tk.c[1]) + ' '); cites++; }
    scroll();
    st.timer = setTimeout(tick, reduced() ? 0 : 32);
  };
  st.start = setTimeout(() => {
    thinking.remove(); st.thinking = null;
    st.body = document.createElement('div'); st.body.className = 'ai-body'; st.body.dir = 'rtl';
    target.append(st.body); tick();
  }, reduced() ? 0 : 480);
}
function ask(key, text) {
  const log = $('#as-log'); if (!log) return;
  $('#as-empty')?.remove();
  const u = document.createElement('div'); u.className = 'msg-user'; u.dir = 'rtl'; u.textContent = text;
  log.append(u);
  const m = document.createElement('div'); m.className = 'msg-ai'; m.dir = 'rtl';
  m.innerHTML = `<span class="ai-label">${svg(IC.info)}مولَّد — راجع الاستشهادات</span>`;
  log.append(m);
  log.scrollTop = log.scrollHeight;
  const segs = ANSWERS[key] || [{ t: 'لم أجد هذا في أحكامك الأربعة المفهرسة. لا أجيب من خارجها.' }];
  stream(m, segs, () => {
    if (!ANSWERS[key]) {
      m.insertAdjacentHTML('beforeend', `<div class="ai-actions"><button class="btn btn-secondary" data-action="semantic">وسّع البحث بالمعنى</button></div>`);
    }
  });
}
function summarize() {
  const sec = $('#summary'); if (!sec) return;
  sec.hidden = false;
  sec.innerHTML = `<div class="summary-head"><span class="ai-label">${svg(IC.info)}ملخّص مولَّد — راجع الاستشهادات</span><button class="btn btn-ghost btn-icon" data-action="close-summary" aria-label="أغلق الملخّص">${svg(IC.x)}</button></div>`;
  const body = document.createElement('div'); sec.append(body);
  stream(body, summaryFor(R[S.rid]));
}

/* ===================== Compare ===================== */
function fieldVals(r, k) { return r.fields.filter(f => f.k === k).map(f => f.value); }
function renderCompare(aId, bId) {
  const a = R[aId], b = R[bId];
  const keys = [['dispute', 'نوع النزاع'], ['nyaba', 'رأي النيابة'], ['principle', 'المبدأ'], ['disposition', 'نوع الحسم'], ['winner', 'النتيجة لصالح']];
  const rows = keys.map(([k, l]) => {
    const va = fieldVals(a, k), vb = fieldVals(b, k);
    const same = va.join('|') === vb.join('|');
    const shared = va.filter(x => vb.includes(x));
    const tag = same ? '' : (shared.length ? `<span class="diff-tag">${svg(IC.alert, 'ic-sm')}مشترك جزئياً</span>` : `<span class="diff-tag">${svg(IC.alert, 'ic-sm')}مختلف</span>`);
    return `<tr data-diff="${same ? 'no' : 'yes'}"><th scope="row">${l}</th><td>${va.join('<br>') || '—'}</td><td>${vb.join('<br>') || '—'}${tag ? '<br>' + tag : ''}</td></tr>`;
  }).join('');
  const others = ORDER.filter(id => id !== aId).map(id => `<button data-action="cmp-pick" data-id="${id}" aria-pressed="${id === bId}">${stamp(R[id], 'sm', false)}</button>`).join('');
  return `<div class="cmp-head"><h2>مقارنة حكمين</h2><button class="btn btn-ghost btn-icon" data-action="cmp-close" aria-label="أغلق">${svg(IC.x)}</button></div>
    <div class="cmp-pick">قارن ${stamp(a, 'sm', false)} مع: ${others}</div>
    <table class="cmp-tbl"><thead><tr><th></th><td>${a.no}/${a.year}</td><td>${b.no}/${b.year}</td></tr></thead><tbody>${rows}</tbody></table>
    <div class="cmp-foot"><button class="btn btn-ghost" data-action="cmp-close">أغلق</button><button class="btn btn-secondary" data-action="cmp-open" data-id="${bId}">افتح ${b.no}/${b.year}</button></div>`;
}
function openCompare(bId) {
  let d = $('#cmp');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'cmp'; d.className = 'cmp'; d.dir = 'rtl';
    d.setAttribute('aria-label', 'مقارنة حكمين');
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
    document.body.append(d);
  }
  d.innerHTML = renderCompare(S.rid, bId);
  if (!d.open) d.showModal();
}

/* ===================== Misc ===================== */
function toast(msg) {
  const r = $('#toasts'); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; r.append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, 2600);
}
function announce(msg) { const a = $('#announcer'); a.textContent = ''; setTimeout(() => a.textContent = msg, 30); }
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { localStorage.setItem('qadi-theme', dark ? 'dark' : 'light'); } catch (e) {}
  const btn = $('[data-action="theme"]'); const lbl = $('#theme-lbl');
  const txt = dark ? 'الوضع الفاتح' : 'الوضع الداكن';
  if (btn) btn.setAttribute('aria-label', txt); if (lbl) lbl.textContent = txt;
}
try { const t = localStorage.getItem('qadi-theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}

/* ===================== Events (delegated) ===================== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'toggle-review') { e.stopPropagation(); toggleReview(a.closest('.fv')); return; }
    if (act === 'review-all') return reviewAll();
    if (act === 'list') return setView('list');
    if (act === 'nav') {
      if (a.dataset.to === 'rulings') { if (S.view !== 'list') setView('list'); return; }
      return toast('هذي الشاشة خارج نموذج اليوم — المعروض: الأحكام وبطاقة الحكم والمساعد');
    }
    if (act === 'assist') { $('#app')?.classList.toggle('assist-open'); return; }
    if (act === 'theme') return setTheme(document.documentElement.dataset.theme !== 'dark');
    if (act === 'summarize') return summarize();
    if (act === 'close-summary') { stopStream(false); const s = $('#summary'); s.hidden = true; s.innerHTML = ''; return; }
    if (act === 'compare') return openCompare(S.rid === 'R3' ? 'R1' : 'R3');
    if (act === 'cmp-pick') return openCompare(a.dataset.id);
    if (act === 'cmp-close') return $('#cmp')?.close();
    if (act === 'cmp-open') { $('#cmp')?.close(); return setView('card', a.dataset.id); }
    if (act === 'draft') return toast('فحص المسودة شاشة مستقلة — في الجولة القادمة');
    if (act === 'semantic') return toast('البحث بالمعنى يعمل على الخادم — خارج هذا النموذج');
  }
  const cite = e.target.closest('.cite'); if (cite) return gotoCite(cite.dataset.r, +cite.dataset.p);
  const q = e.target.closest('[data-q]'); if (q) return ask(q.dataset.q, q.textContent);
  const row = e.target.closest('tr[data-open]'); if (row) return setView('card', row.dataset.open);
  const fv = e.target.closest('.fv'); if (fv && !e.target.closest('button')) return focusPara(fv.dataset.r, +fv.dataset.p, false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const row = e.target.closest?.('tr[data-open]'); if (row) { e.preventDefault(); setView('card', row.dataset.open); return; }
    const fv = e.target.classList?.contains('fv') ? e.target : null; if (fv) { focusPara(fv.dataset.r, +fv.dataset.p, true); return; }
    if (e.target.id === 'as-input' && !e.shiftKey) { e.preventDefault(); $('#as-form').requestSubmit(); return; }
  }
  if (e.key === 'Escape') $('#app')?.classList.remove('assist-open');
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'as-form') return;
  e.preventDefault();
  const b = $('#as-send');
  if (b.dataset.mode === 'stop') return stopStream(true);
  const inp = $('#as-input'); const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  const hit = SUGG.find(([, l]) => l === v);
  ask(hit ? hit[0] : 'free', v);
});
document.addEventListener('pointerover', e => setLit(keyFrom(e.target)));
document.addEventListener('focusin', e => { const k = keyFrom(e.target); if (k) setLit(k); });
window.addEventListener('resize', measureHead);

/* ===================== Picker — PICKER.md wiring ===================== */
const variants = VARIANTS.map((_, i) => () => { S.variant = i; return shell(); });
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  clearTimers(); stopStream(false); $('#cmp')?.close();
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); afterMount(); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
// على الجوال المساعد ورقة سفلية — المبدّل يصعد للأعلى حتى لا يغطيها (الاستثناء المسموح في PICKER.md)
const mq = matchMedia('(max-width: 767px)');
const placePicker = () => mq.matches ? picker.setAttribute('data-position', 'top') : picker.removeAttribute('data-position');
placePicker(); mq.addEventListener?.('change', placePicker);

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
