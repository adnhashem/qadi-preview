<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الخريطة — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== الخريطة — فضاء داكن: المبادئ عُقد في المنتصف والأحكام حولها بخيوط، والحكم يفتح كورقة فوق الخريطة ===== */
:root {
  color-scheme: dark;
  --space: #0b1020; --space-2: #121a30; --grid: #1a2340;
  --fg: #e9edf7; --fg-2: #aab3cc; --fg-3: #6f7a99;
  --node: #1b2544; --node-line: #34427a;
  --p1: #7cc4ff; --p2: #ffb86b; --p3: #9af2c4; --p4: #f28bd1;
  --accent: #7cc4ff; --warn: #ffd166; --unrev: #ff9b6b; --ok: #9af2c4;
  --paper: #fbf8f2; --paper-2: #f1ece2; --ink: #1c1b18; --ink-2: #5a5649; --ink-3: #8a8577; --paper-line: #e4ded0;
  --font-ui: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-reading: 'Noto Naskh Arabic', serif;
  --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 160ms; --mid: 320ms; --slow: 600ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--space); color: var(--fg); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; } .ic-sm { width: 14px; height: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.app { position: relative; height: 100dvh; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--space-2), var(--space) 70%); }
.app::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 28px 28px; opacity: .5; pointer-events: none; }

/* ---------- floating chrome ---------- */
.top { position: absolute; top: 18px; inset-inline: 22px; z-index: 5; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; padding: 8px 14px 8px 10px; border-radius: 999px; background: rgb(11 16 32 / .7); border: 1px solid var(--node-line); backdrop-filter: blur(8px); }
.brand-mark { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--space); display: grid; place-items: center; font-size: 13px; }
.pills { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgb(11 16 32 / .7); border: 1px solid var(--node-line); backdrop-filter: blur(8px); overflow-x: auto; }
.pills button { height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--fg-2); font-size: 13px; cursor: pointer; white-space: nowrap; transition: background-color var(--fast), color var(--fast); }
.pills button:hover { color: var(--fg); } .pills button[aria-current] { background: var(--node); color: var(--fg); }
.top .sp { flex: 1; }
.legend { display: flex; gap: 12px; padding: 8px 14px; border-radius: 999px; background: rgb(11 16 32 / .7); border: 1px solid var(--node-line); font-size: 12px; color: var(--fg-2); backdrop-filter: blur(8px); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-inline-end: 5px; }

/* ---------- map ---------- */
.map { position: absolute; inset: 0; display: grid; place-items: center; padding: 90px 24px 110px; }
.map svg { width: 100%; height: 100%; max-width: 1200px; overflow: visible; }
.lnk { stroke: var(--node-line); stroke-width: 1.5; fill: none; opacity: .8; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw var(--slow) var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lnk.diff { stroke: var(--warn); stroke-dasharray: 4 4; animation: none; stroke-dashoffset: 0; }
.pn { cursor: default; }
.pn circle { fill: var(--node); stroke-width: 2; }
.pn text { fill: var(--fg); font-family: var(--font-ui); font-size: 13px; font-weight: 600; text-anchor: middle; }
.pn .cnt { fill: var(--fg-3); font-size: 11px; font-weight: 400; }
.rn { cursor: pointer; }
.rn rect { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; rx: 10; transition: stroke var(--fast), fill var(--fast); }
.rn:hover rect, .rn:focus-visible rect { stroke: var(--accent); fill: #22305a; }
.rn.cur rect { stroke: var(--accent); stroke-width: 2.5; fill: #22305a; }
.rn text { fill: var(--fg); font-family: var(--font-ui); font-size: 12.5px; text-anchor: start; direction: rtl; }
.rn .no { fill: var(--accent); font-weight: 700; font-size: 12px; }
.rn .st { fill: var(--fg-3); font-size: 11px; }
.rn .st.pend { fill: var(--unrev); }
.rn.unrev rect { stroke-dasharray: 6 4; }
.node-in { animation: pop var(--mid) var(--ease) both; transform-box: fill-box; transform-origin: center; animation-delay: calc(var(--i) * 60ms); }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
.hint { position: absolute; bottom: 92px; inset-inline-start: 50%; transform: translateX(50%); font-size: 12px; color: var(--fg-3); pointer-events: none; }

/* ---------- paper (ruling) ---------- */
.paper { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: min(760px, 100vw); z-index: 20; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; box-shadow: 0 0 80px rgb(0 0 0 / .6); transform: translateX(100%); transition: transform var(--mid) var(--ease); visibility: hidden; }
.app.paper-open .paper { transform: none; visibility: visible; }
.p-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--paper-line); background: var(--paper); position: sticky; top: 0; z-index: 2; }
.p-head .sp { flex: 1; }
.pb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #cfc8b8; border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.pb:hover { background: var(--paper-2); }
.pb-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pb-icon { width: 34px; padding: 0; justify-content: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #cfc8b8; border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn-secondary { border-color: var(--ink); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.p-body { flex: 1; overflow: auto; padding: 22px 28px 60px; }
.stamp { display: inline-flex; border: 1px solid #cfc8b8; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.stamp > span { padding: 2px 8px; } .stamp > span + span { border-inline-start: 1px solid #cfc8b8; }
.p-body h1 { margin: 10px 0 6px; font-size: 24px; font-weight: 600; line-height: 1.35; }
.p-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink-3); font-size: 12.5px; margin-bottom: 16px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge .ic { width: 12px; height: 12px; }
.badge-ok { color: #1f7a46; } .badge-warn { color: #b4541a; }
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 18px; }
.fv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--paper-2); cursor: pointer; border: 1px solid transparent; transition: border-color var(--fast); }
.fv:hover, .fv.lit { border-color: var(--ink-3); }
.fv-label { grid-column: 1; font-size: 11px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.fv-value { grid-column: 1; font-size: 13.5px; }
.fv[data-state="unreviewed"] .fv-value { color: #b4541a; }
.fv[data-state="unreviewed"] .fv-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #b4541a; }
.fv[data-state="warn"] { background: #fdf0d6; }
.fv[data-state="warn"] .fv-label { color: #8a5a00; }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 26px; padding: 0 8px; border: 1px solid #cfc8b8; border-radius: 999px; background: var(--paper); font-size: 11px; font-weight: 600; cursor: pointer; opacity: 0; transition: opacity var(--fast); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border-color: transparent; color: #1f7a46; padding-inline: 0; background: none; }
@media (hover: none) { .fv-btn { opacity: 1; } }
.summary { padding: 12px 14px; margin-bottom: 14px; border-inline-start: 3px solid var(--ink); background: var(--paper-2); border-radius: 6px; font-size: 14px; line-height: 1.9; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.ai-label .ic { width: 13px; height: 13px; }
.para { margin: 0 0 2px; padding: 8px 12px 8px 8px; font-family: var(--font-reading); font-size: 17px; line-height: 2; border-radius: 6px; border-inline-start: 3px solid transparent; transition: background-color var(--fast), border-color var(--fast); }
.para:hover, .para.lit, .para.flash { background: var(--paper-2); border-inline-start-color: var(--ink); }
.pnum { font-family: var(--font-ui); font-size: 11px; color: var(--ink-3); margin-inline-end: 8px; }
.cite { display: inline-flex; align-items: center; margin-inline: 2px; padding: 0 6px; border: 1px solid currentColor; border-radius: 4px; background: none; color: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.7; cursor: pointer; vertical-align: baseline; }
.cite.unrev { border-style: dashed; }

/* ---------- assistant dock (bottom) ---------- */
.dock { position: absolute; bottom: 20px; inset-inline-start: 50%; transform: translateX(50%); z-index: 25; width: min(720px, calc(100vw - 32px)); background: rgb(18 26 48 / .92); border: 1px solid var(--node-line); border-radius: 18px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgb(0 0 0 / .5); display: flex; flex-direction: column; overflow: hidden; }
.as-log { display: none; max-height: 44vh; overflow: auto; padding: 16px 18px; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--node-line); }
.app.assist-open .as-log { display: flex; }
.as-intro { margin: 0; color: var(--fg-2); font-size: 13.5px; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sugg button { padding: 7px 12px; border: 1px solid var(--node-line); border-radius: 999px; background: var(--node); color: var(--fg); font-size: 12.5px; cursor: pointer; }
.sugg button:hover { border-color: var(--accent); }
.msg-user { align-self: flex-end; padding: 7px 12px; background: var(--node); border-radius: 12px 12px 2px 12px; font-size: 13.5px; max-width: 80%; }
.msg-ai { font-size: 14px; line-height: 1.9; }
.msg-ai .cite { color: var(--accent); }
.msg-ai .cite.unrev { color: var(--unrev); }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 13px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 900ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 11px; margin-top: 4px; }
.ai-actions { margin-top: 8px; }
.ai-actions .btn { background: var(--node); border-color: var(--node-line); color: var(--fg); }
.as-form { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; }
.as-form .ic { color: var(--accent); }
.as-form textarea { flex: 1; resize: none; field-sizing: content; min-height: 24px; max-height: 6rem; background: none; border: 0; padding: 6px 0; font-size: 14.5px; line-height: 1.5; }
.as-form textarea:focus-visible { outline: none; }
.as-ctx { font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.send { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--accent); color: var(--space); display: grid; place-items: center; cursor: pointer; }
.send[data-mode="stop"] { background: var(--unrev); }
.dock-tools { border: 0; background: none; color: var(--fg-2); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 8px; border-radius: 6px; white-space: nowrap; }
.dock-tools:hover { background: var(--node); color: var(--fg); }

/* ---------- compare ---------- */
.cmp { width: min(680px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--node-line); border-radius: 14px; background: var(--space-2); color: var(--fg); box-shadow: 0 20px 60px rgb(0 0 0 / .5); }
.cmp::backdrop { background: rgb(0 0 0 / .5); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--node-line); }
.cmp-head h2 { margin: 0; font-size: 16px; }
.cmp .btn { background: var(--node); border-color: var(--node-line); color: var(--fg); }
.cmp-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 12px 18px; font-size: 13px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 1px; cursor: pointer; }
.cmp .stamp { border-color: var(--node-line); color: var(--fg-2); }
.cmp .stamp > span + span { border-color: var(--node-line); }
.cmp-pick button[aria-pressed="true"] .stamp { border-color: var(--accent); color: var(--accent); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp-tbl th, .cmp-tbl td { padding: 10px 18px; border-top: 1px solid var(--node-line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 12px; width: 22%; font-weight: 600; }
.cmp-tbl tr[data-diff="yes"] td:last-child { color: var(--warn); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--warn); }
.cmp-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 18px; border-top: 1px solid var(--node-line); }
.toasts { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 999px; background: var(--fg); color: var(--space); font-size: 13px; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 10px; inset-inline-end: 12px; z-index: 40; font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-radius: 999px; background: var(--space-2); border: 1px solid var(--node-line); }

@media (max-width: 760px) {
  .top { inset-inline: 12px; top: 12px; flex-wrap: wrap; }
  .legend { display: none; }
  .map { padding: 110px 8px 120px; }
  .paper { width: 100vw; }
  .p-body { padding: 16px; }
  .as-ctx { display: none; }
  .dock { bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; animation-delay: 0ms !important; } .lnk { stroke-dashoffset: 0; animation: none; } }
</style>
</head>
<body>
<a class="hub-link" href="../">← التصاميم</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, counts, badge, stamp, fvHTML, assistEmptyHTML, ctxText, $, $$ } = Q;
  const g = (r, k) => (r.fields.find(f => f.k === k) || {}).value || '';
  const principlesOf = r => r.fields.filter(f => f.k === 'principle').map(f => f.value);
  const ALLP = [...new Set(ORDER.flatMap(id => principlesOf(R[id])))];
  const COL = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
  function layout() {
    const W = 1100, H = 640, cx = W / 2, cy = H / 2;
    const P = ALLP.map((p, i) => { const a = -Math.PI / 2 + i * (2 * Math.PI / ALLP.length); return { p, i, x: cx + Math.cos(a) * 150, y: cy + Math.sin(a) * 110 }; });
    const RN = ORDER.map((id, i) => { const a = -Math.PI / 2 + Math.PI / ORDER.length + i * (2 * Math.PI / ORDER.length); return { id, i, x: cx + Math.cos(a) * 430, y: cy + Math.sin(a) * 240 }; });
    return { W, H, P, RN };
  }
  function mapSVG() {
    const { W, H, P, RN } = layout();
    const byP = Object.fromEntries(P.map(n => [n.p, n]));
    const base = {}; ALLP.forEach(p => { const first = ORDER.filter(id => principlesOf(R[id]).includes(p))[0]; base[p] = g(R[first], 'winner'); });
    const links = RN.flatMap(n => principlesOf(R[n.id]).map(p => { const t = byP[p]; const diff = g(R[n.id], 'winner') !== base[p]; return `<path class="lnk ${diff ? 'diff' : ''}" d="M${n.x},${n.y} C${n.x},${(n.y + t.y) / 2} ${t.x},${(n.y + t.y) / 2} ${t.x},${t.y}" style="stroke:${diff ? '' : COL[t.i % 4]}"/>`; })).join('');
    const pn = P.map(n => { const c = ORDER.filter(id => principlesOf(R[id]).includes(n.p)).length; return `<g class="pn" transform="translate(${n.x},${n.y})"><g class="node-in" style="--i:${n.i}"><circle r="46" style="stroke:${COL[n.i % 4]}"/><foreignObject x="-60" y="-26" width="120" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 11.5px/1.35 var(--font-ui);color:var(--fg);text-align:center;display:grid;place-items:center;height:52px;padding:0 4px">${n.p}</div></foreignObject><text class="cnt" y="38">${c} ${c > 1 ? 'أحكام' : 'حكم'}</text></g></g>`; }).join('');
    const rn = RN.map(n => { const r = R[n.id]; const [d, t] = counts(r); const un = d < t; const cur = S.view === 'card' && S.rid === n.id;
      return `<g class="rn ${un ? 'unrev' : ''} ${cur ? 'cur' : ''}" transform="translate(${n.x - 110},${n.y - 34})" data-open="${n.id}" tabindex="0" role="button" aria-label="افتح ${r.title}"><g class="node-in" style="--i:${n.i + ALLP.length}">
        <rect width="220" height="68"/>
        <text class="no" x="206" y="22">${r.no}/${r.year} · ${r.circuit}</text>
        <text x="206" y="42">${r.title.length > 26 ? r.title.slice(0, 26) + '…' : r.title}</text>
        <text class="st ${un ? 'pend' : ''}" x="206" y="59">${un ? `${d}/${t} مراجَع` : 'مراجَع كاملاً'} · ${r.date}</text></g></g>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="خريطة المبادئ والأحكام">${links}${pn}${rn}</svg>`;
  }
  function renderCard(r) {
    const [d, t] = counts(r);
    const fields = r.fields.map((f, idx) => fvHTML(r, f, idx, idx)).join('');
    const paras = r.paras.map((txt, i) => `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}"><span class="pnum num">${i + 1}</span>${txt}</p>`).join('');
    return `<div class="p-head" id="head">
        <button class="pb pb-icon" data-action="list" aria-label="أغلق وارجع للخريطة">${svg(IC.x)}</button>
        ${stamp(r, 'sm', true)}<span class="sp"></span>
        <span class="num" id="rc-count" style="font-size:12px;color:var(--ink-3)">${d} من ${t} مراجَع</span>
        <button class="pb" data-action="summarize">${svg(IC.sum, 'ic-sm')}لخّص</button>
        <button class="pb" data-action="compare">${svg(IC.compare, 'ic-sm')}قارن</button>
        <button class="pb pb-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check, 'ic-sm')}راجعت الكل</button>
      </div>
      <div class="p-body">
        <h1>${r.title}</h1>
        <div class="p-meta"><span>${r.kind}</span><span>·</span><span class="num">${r.date}</span><span id="rc-badge">${badge(r)}</span></div>
        <div class="threads">${fields}</div>
        <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
        ${paras}
      </div>`;
  }
  function renderList() { return ''; }
  function shell() {
    return `<div class="app ${S.view === 'card' ? 'paper-open' : ''}" id="app">
      <div class="top">
        <div class="brand"><span class="brand-mark" aria-hidden="true">ق</span>نظام القاضي</div>
        <nav class="pills" aria-label="التنقّل">${NAV.map(([k, l]) => `<button data-action="nav" data-to="${k}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
        <span class="sp"></span>
        <div class="legend"><span><i style="background:var(--node-line)"></i>نفس الاتجاه</span><span><i style="background:var(--warn)"></i>خالف الاتجاه</span><span><i style="border:1.5px dashed var(--unrev)"></i>بانتظار المراجعة</span></div>
      </div>
      <div class="map" id="map" aria-label="خريطة الأحكام">${mapSVG()}</div>
      <div class="hint">انقر حكماً لفتحه · الخيوط تربط الحكم بمبادئه</div>
      <aside class="paper" aria-label="الحكم"><div id="main">${S.view === 'card' ? renderCard(R[S.rid]) : ''}</div></aside>
      <section class="dock" aria-label="المساعد">
        <div class="as-log" id="as-log" role="log">${assistEmptyHTML()}</div>
        <form class="as-form" id="as-form">${svg(IC.spark)}<label class="sr-only" for="as-input">اسأل</label><textarea id="as-input" rows="1" placeholder="اسأل أحكامك…"></textarea><span class="as-ctx" id="as-ctx">${ctxText()}</span><button type="button" class="dock-tools" data-action="draft">افحص مسودة</button><button type="submit" class="send" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button></form>
      </section>
    </div>`;
  }
  function refreshMap() { const m = $('#map'); if (m) m.innerHTML = mapSVG(); }
  window.DESIGN = {
    key: 'kharita', shell, renderCard, renderList,
    afterView() { const app = $('#app'); app.classList.toggle('paper-open', S.view === 'card'); refreshMap(); },
    beforeAsk() { $('#app')?.classList.add('assist-open'); },
    beforeCite() {},
    onAction(act) { if (act === 'assist') { $('#app').classList.toggle('assist-open'); return true; } return false; }
  };
  // the paper is a flex column: p-head + p-body inside #main; make #main flex too
  const st = document.createElement('style'); st.textContent = '.paper #main{display:flex;flex-direction:column;min-height:0;height:100%}'; document.head.append(st);
  document.addEventListener('focusin', e => { if (e.target.id === 'as-input') $('#app')?.classList.add('assist-open'); });
  document.addEventListener('click', e => { if (!e.target.closest('.dock') && !e.target.closest('.cite')) $('#app')?.classList.remove('assist-open'); }, true);
  // review changes should refresh node states
  document.addEventListener('click', e => { if (e.target.closest('[data-action="toggle-review"], [data-action="review-all"]')) setTimeout(refreshMap, 50); });
  S.view = 'list'; // تبدأ على الخريطة
  Q.mountAll();
})();
</script>
</body>
</html>
