<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>المحرّك — نظام القاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== المحرّك — نمط Lexis/Westlaw: بحث أولاً، مرشّحات، خلاصة AI فوق النتائج، قارئ بخلاصة جانبية ===== */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --bg-2: #ffffff; --bg-3: #e9ebef;
  --line: #dde0e6; --line-2: #c2c7d0;
  --fg: #171a20; --fg-2: #474c57; --fg-3: #636975;
  --accent: #3d3a9c; --accent-2: #2d2a7a; --accent-soft: #ecebf8; --accent-line: #b9b6e3;
  --ok: #1f7a46; --warn: #955f00; --unrev: #ae5118; --unrev-soft: #fff1e8;
  --font-ui: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-reading: 'Noto Naskh Arabic', serif;
  --r: 8px; --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 140ms; --mid: 240ms;
  --facet-w: 240px; --aside-w: 320px; --hdr-h: 64px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15171c; --bg-2: #1d2027; --bg-3: #262a33; --line: #2e323c; --line-2: #414651;
  --fg: #eceef2; --fg-2: #b5b9c2; --fg-3: #8d929d;
  --accent: #a9a6ee; --accent-2: #c1bff4; --accent-soft: #262544; --accent-line: #4b4890;
  --ok: #6fc896; --warn: #e4b64c; --unrev: #e6905f; --unrev-soft: #2e241d;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; } .ic-sm { width: 14px; height: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header with search ---------- */
.hdr { position: sticky; top: 0; z-index: 20; height: var(--hdr-h); background: var(--bg-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.sbox { flex: 1; max-width: 720px; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); transition: border-color var(--fast), box-shadow var(--fast); }
.sbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg-2); }
.sbox .ic { color: var(--fg-3); }
.sbox input { flex: 1; border: 0; background: none; font-size: 15px; min-width: 0; }
.sbox input:focus-visible { outline: none; }
.sbox .go { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
.hnav { display: flex; gap: 2px; margin-inline-start: auto; }
.hnav button { height: 36px; padding: 0 10px; border: 0; background: none; color: var(--fg-2); border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.hnav button:hover { background: var(--bg-3); color: var(--fg); }
.hnav button[aria-current] { color: var(--accent); background: var(--accent-soft); }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--fg-2); border-radius: 6px; cursor: pointer; }
.ib:hover { background: var(--bg-3); }

/* ---------- results layout ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 22px 24px 80px; }
.results { display: grid; grid-template-columns: var(--facet-w) minmax(0, 1fr); gap: 24px; }
.facets { position: sticky; top: calc(var(--hdr-h) + 22px); align-self: start; display: grid; gap: 18px; }
.facet h3 { margin: 0 0 8px; font-size: 12px; color: var(--fg-3); font-weight: 600; }
.facet label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 0; cursor: pointer; color: var(--fg-2); }
.facet label .n { margin-inline-start: auto; font-size: 11px; color: var(--fg-3); }
.facet input { accent-color: var(--accent); }
.res-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.res-head h1 { margin: 0; font-size: 20px; font-weight: 600; }
.res-head .cnt { color: var(--fg-3); font-size: 13px; }
.res-head .sort { margin-inline-start: auto; font-size: 13px; color: var(--fg-3); }
.overview { padding: 16px 18px; margin-bottom: 14px; border: 1px solid var(--accent-line); border-radius: var(--r); background: var(--bg-2); border-inline-start: 4px solid var(--accent); }
.ov-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.overview p { margin: 0; line-height: 1.9; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 18px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); cursor: pointer; transition: border-color var(--fast), box-shadow var(--fast); }
.card:hover { border-color: var(--accent-line); box-shadow: 0 6px 20px rgb(23 26 32 / .06); }
.c-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); }
.c-title { font-size: 17px; font-weight: 600; color: var(--accent); }
.card:hover .c-title { text-decoration: underline; text-underline-offset: 3px; }
.c-snip { font-family: var(--font-reading); font-size: 15px; color: var(--fg-2); line-height: 1.8; }
.c-snip mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; padding: 0 2px; }
.c-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg-3); color: var(--fg-2); }
.card > :not(.c-side) { grid-column: 1; }
.c-side { grid-column: 2; grid-row: 1 / 5; align-self: start; display: grid; gap: 6px; justify-items: end; }
.stamp { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--fg-2); background: var(--bg-2); }
.stamp > span { padding: 2px 8px; } .stamp > span + span { border-inline-start: 1px solid var(--line-2); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.badge .ic { width: 12px; height: 12px; }
.badge-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.badge-warn { color: var(--unrev); background: var(--unrev-soft); }

/* ---------- reader ---------- */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) var(--aside-w); gap: 24px; }
.r-main { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 32px 48px; min-width: 0; }
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-3); font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 12px; }
.crumb:hover { color: var(--accent); }
.r-main h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.r-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--fg-3); font-size: 13px; margin-bottom: 18px; }
.r-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg-2); color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color var(--fast); }
.btn:hover { background: var(--bg-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn-primary:hover { background: var(--accent-2); }
.btn-ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn-secondary { border-color: var(--accent); color: var(--accent); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }
.summary { padding: 14px 16px; margin-bottom: 18px; border: 1px solid var(--accent-line); border-inline-start: 4px solid var(--accent); border-radius: var(--r); background: var(--accent-soft); font-size: 14px; line-height: 1.9; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); font-weight: 600; }
.ai-label .ic { width: 13px; height: 13px; }
.para { position: relative; margin: 0 0 2px; padding: 8px 12px 8px 8px; font-family: var(--font-reading); font-size: 17.5px; line-height: 2; border-radius: 6px; border-inline-start: 3px solid transparent; transition: background-color var(--fast), border-color var(--fast); }
.para:hover, .para.lit { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.para.flash { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.pnum { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); margin-inline-end: 8px; }

.r-aside { position: sticky; top: calc(var(--hdr-h) + 22px); align-self: start; display: grid; gap: 12px; max-height: calc(100dvh - var(--hdr-h) - 40px); overflow: auto; }
.box { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.box h3 { margin: 0 0 10px; font-size: 12px; color: var(--fg-3); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.box h3 .num { font-weight: 500; }
.meter { height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; margin: -4px 0 12px; }
.meter i { display: block; height: 100%; background: var(--accent); transform: scaleX(var(--pct, 0)); transform-origin: right; transition: transform var(--mid) var(--ease); }
.fv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 7px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; transition: background-color var(--fast); }
.fv:hover, .fv.lit { background: var(--accent-soft); }
.fv-label { grid-column: 1; font-size: 11px; color: var(--fg-3); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.fv-value { grid-column: 1; font-size: 13.5px; }
.fv[data-state="unreviewed"] .fv-value { color: var(--unrev); }
.fv[data-state="unreviewed"] .fv-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--unrev); }
.fv[data-state="warn"] { background: color-mix(in srgb, var(--warn) 8%, transparent); }
.fv[data-state="warn"] .fv-label { color: var(--warn); }
.fv-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 26px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg-2); font-size: 11px; font-weight: 600; cursor: pointer; opacity: 0; transition: opacity var(--fast); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.fv:hover .fv-btn, .fv:focus-within .fv-btn, .fv.lit .fv-btn { opacity: 1; }
.fv-btn:hover { border-color: var(--accent); color: var(--accent); }
.fv[data-state="reviewed"] .fv-btn { opacity: 1; border-color: transparent; color: var(--ok); padding-inline: 0; }
@media (hover: none) { .fv-btn { opacity: 1; } }
.related { display: grid; gap: 8px; }
.related button { display: grid; gap: 2px; text-align: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 13px; }
.related button:hover { border-color: var(--accent-line); }
.related small { color: var(--fg-3); font-size: 11px; }

/* ---------- حيّ: النظام يُريك ما يفعله (منقول من المخطوط) ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pipe { display: flex; align-items: center; gap: 16px; min-height: 42px; padding: 8px 14px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font-size: 12px; color: var(--fg-3); overflow-x: auto; }
.pipe[hidden] { display: none; }
.step { display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: color var(--fast); }
.step .dot { width: 16px; height: 16px; display: grid; place-items: center; border: 1.5px solid var(--line-2); border-radius: 50%; color: #fff; transition: background-color var(--fast), border-color var(--fast); }
.step .dot .ic { width: 10px; height: 10px; opacity: 0; }
.step.active { color: var(--fg); }
.step.active .dot { border-color: var(--accent); animation: pulse 600ms var(--ease) infinite alternate; }
.step.done { color: var(--fg); }
.step.done .dot { background: var(--accent); border-color: var(--accent); animation: none; }
.step.done .dot .ic { opacity: 1; }
.pipe-bar { flex: 1; min-width: 3rem; height: 2px; background: var(--line); position: relative; overflow: hidden; border-radius: 1px; }
.pipe-bar i { position: absolute; inset: 0; background: var(--accent); transform: scaleX(var(--prog, 0)); transform-origin: right; transition: transform 400ms var(--ease); }
.pipe-done { display: flex; align-items: center; gap: 8px; flex: 1; color: var(--fg-2); white-space: nowrap; animation: rise var(--mid) var(--ease) both; }
.pipe-done > .ic-sm { color: var(--ok); }
.pipe-done .warn-n { color: var(--warn); font-weight: 600; }
.pipe-done .replay { margin-inline-start: auto; height: 28px; font-size: 12px; }
.reader.analyzing .para { opacity: .45; transition: opacity var(--fast), background-color var(--fast), border-color var(--fast); }
.reader.analyzing .para.scanned { opacity: 1; }
.reader .para.scanning { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.reader.analyzing .r-aside .fv, .reader.analyzing .related { opacity: 0; }
.reader.analyzing .meter i { transform: scaleX(0); }
.reader.revealed .r-aside .fv { animation: rise var(--fast) var(--ease) both; animation-delay: calc(min(var(--i), 12) * 40ms); }
.reader.revealed .related { animation: rise var(--mid) var(--ease) both; animation-delay: 480ms; }
.notice { padding: 10px 12px; font-size: 13.5px; line-height: 1.9; background: var(--bg); border: 1px solid var(--line); border-inline-start: 3px solid var(--warn); border-radius: 6px; animation: rise var(--mid) var(--ease) both; }
.notice.clean { border-inline-start-color: var(--ok); }
.notice p { margin: 4px 0 0; }

/* ---------- assistant drawer ---------- */
.assist { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(400px, 100vw); z-index: 30; display: flex; flex-direction: column; background: var(--bg-2); border-inline-start: 1px solid var(--line); box-shadow: 0 0 40px rgb(0 0 0 / .18); transform: translateX(-100%); visibility: hidden; transition: transform var(--mid) var(--ease), visibility 0s linear var(--mid); }
.app.assist-open .assist { transform: none; visibility: visible; transition: transform var(--mid) var(--ease); }
.as-head { height: var(--hdr-h); display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.as-ctx { margin-inline-start: auto; font-size: 11px; color: var(--fg-3); font-weight: 400; }
.as-log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.as-intro { margin: 0 0 8px; color: var(--fg-2); font-size: 13.5px; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg button { text-align: start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; cursor: pointer; }
.sugg button:hover { border-color: var(--accent-line); }
.msg-user { align-self: flex-end; max-width: 88%; padding: 7px 12px; background: var(--accent-soft); border-radius: 10px 10px 2px 10px; font-size: 13.5px; }
.msg-ai { font-size: 14px; line-height: 1.85; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 13px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 800ms var(--ease) infinite alternate; }
@keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
.stopped { display: block; color: var(--fg-3); font-size: 11px; margin-top: 4px; }
.ai-actions { margin-top: 8px; }
.cite { display: inline-flex; align-items: center; margin-inline: 2px; padding: 0 6px; border: 1px solid var(--accent-line); border-radius: 4px; background: var(--accent-soft); color: var(--accent-2); font-size: 11.5px; font-weight: 600; line-height: 1.7; cursor: pointer; vertical-align: baseline; }
.cite:hover { background: var(--accent-line); }
.cite.unrev { border-color: var(--unrev); color: var(--unrev); background: var(--unrev-soft); }
.as-tools { padding: 0 16px 8px; }
.as-form { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
.as-form textarea { flex: 1; resize: none; field-sizing: content; min-height: 34px; max-height: 7rem; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); font-size: 13.5px; line-height: 1.5; }

/* ---------- compare ---------- */
.cmp { width: min(680px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); color: var(--fg); box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
.cmp::backdrop { background: rgb(23 26 32 / .4); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cmp-head h2 { margin: 0; font-size: 16px; }
.cmp-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 12px 18px; font-size: 13px; color: var(--fg-3); }
.cmp-pick button { border: 0; background: none; padding: 1px; cursor: pointer; }
.cmp-pick button[aria-pressed="true"] .stamp { border-color: var(--accent); color: var(--accent); }
.cmp-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp-tbl th, .cmp-tbl td { padding: 10px 18px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.cmp-tbl th { color: var(--fg-3); font-size: 12px; width: 22%; font-weight: 600; }
.cmp-tbl tr[data-diff="yes"] td:last-child { color: var(--warn); }
.diff-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--warn); }
.cmp-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 18px; border-top: 1px solid var(--line); }
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; transition: opacity var(--fast); }
.toast.out { opacity: 0; }
.hub-link { position: fixed; bottom: 10px; inset-inline-end: 12px; z-index: 40; font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line); }

@media (max-width: 1100px) { .reader { grid-template-columns: minmax(0, 1fr); } .r-aside { position: static; max-height: none; } }
@media (max-width: 900px) {
  .results { grid-template-columns: minmax(0, 1fr); }
  .facets { display: none; }
  .hnav { display: none; }
  .hdr { gap: 8px; padding: 0 12px; }
  .brand .lbl { display: none; }
  .sbox .go { display: none; }
  .wrap { padding: 14px 12px 80px; }
  .r-main { padding: 20px 16px 40px; }
  .r-main h1 { font-size: 22px; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .c-side { grid-column: 1; grid-row: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .r-meta, .r-actions { gap: 6px; }
  .sbox { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; } }
</style>
</head>
<body>
<a class="hub-link" href="../">← التصاميم</a>
<div id="stage"></div>
<script src="../shared.js"></script>
<script>
(function () {
  const Q = window.QADI; const { R, ORDER, S, svg, IC, NAV, counts, badge, stamp, fvHTML, assistEmptyHTML, ctxText, $, $$ } = Q;
  const g = (r, k) => (r.fields.find(f => f.k === k) || {}).value || '';
  const principlesOf = r => r.fields.filter(f => f.k === 'principle').map(f => f.value);
  function related(r) {
    const mine = principlesOf(r);
    return ORDER.filter(id => id !== r.id && principlesOf(R[id]).some(p => mine.includes(p)));
  }
  /* ---------- حيّ: شريط التحليل عند فتح الحكم أول مرة ---------- */
  const seen = new Set(); let ptimers = [];
  const pl = (fn, ms) => ptimers.push(setTimeout(fn, ms));
  const clearPipe = () => { ptimers.forEach(clearTimeout); ptimers = []; };
  const anonCount = r => r.paras.join(' ').match(/\[[^\]]+\]/g)?.length || 0;
  const nFields = n => n === 1 ? 'حقل واحد' : n === 2 ? 'حقلان' : n <= 10 ? `<span class="num">${n}</span> حقول` : `<span class="num">${n}</span> حقلاً`;
  const nPrinciples = n => n === 0 ? 'بلا مبدأ' : n === 1 ? 'مبدأ واحد' : n === 2 ? 'مبدآن' : `<span class="num">${n}</span> مبادئ`;
  const warnOf = r => r.fields.find(f => f.state === 'warn');
  function pipeStepsHTML(r) {
    const a = anonCount(r); const [, t] = counts(r);
    return `<span class="step"><span class="dot">${svg(IC.check)}</span><span>استخراج النص</span></span>
      <span class="step"><span class="dot">${svg(IC.check)}</span><span>التجهيل · ${a ? `<span class="num">${a}</span> اسم` : 'لا أسماء أفراد'}</span></span>
      <span class="step"><span class="dot">${svg(IC.check)}</span><span>استخراج الحقول · <span class="num">${t}</span></span></span>
      <span class="pipe-bar"><i></i></span>`;
  }
  function pipeDoneHTML(r) {
    const [, t] = counts(r); const w = warnOf(r);
    return `<span class="pipe-done">${svg(IC.check, 'ic-sm')}<span>اكتمل التحليل: ${nFields(t)} · ${nPrinciples(principlesOf(r).length)} · ${w ? `<span class="warn-n">تنبيه صياغة واحد</span> ${Q.citeHTML(r.id, w.p)}` : 'بلا تنبيهات صياغة'}</span>
      <button class="btn btn-ghost replay" data-action="replay">أعد عرض التحليل</button></span>`;
  }
  function addNotice(r) {
    const log = $('#as-log'); if (!log || $(`#notice-${r.id}`)) return;
    const [, t] = counts(r); const w = warnOf(r);
    const div = document.createElement('div'); div.className = 'notice' + (w ? '' : ' clean'); div.id = `notice-${r.id}`; div.dir = 'rtl';
    div.innerHTML = `<span class="ai-label">${svg(IC.info)}مولَّد — راجع الاستشهادات</span>
      <p>اكتمل تحليل الطعن <span class="num">${r.no}/${r.year}</span>: ${nFields(t)} و${nPrinciples(principlesOf(r).length)}${w ? `، و<strong>تنبيه صياغة</strong> واحد ${Q.citeHTML(r.id, w.p)} — ${w.value}.` : '، بلا تنبيهات صياغة.'}</p>`;
    log.prepend(div);
  }
  function runPipeline() {
    clearPipe();
    const head = $('#head'); const pipe = $('#pipeline');
    if (S.view !== 'card' || !head?.classList.contains('reader') || !pipe) return;
    const r = R[S.rid];
    if (seen.has(r.id)) return;
    seen.add(r.id);
    if (Q.reduced()) { pipe.innerHTML = pipeDoneHTML(r); addNotice(r); return; }
    pipe.innerHTML = pipeStepsHTML(r);
    head.classList.remove('revealed'); head.classList.add('analyzing');
    const steps = $$('.step', pipe); const bar = $('.pipe-bar i', pipe); const paras = $$('.para', head);
    const setStep = i => { steps.forEach((s, j) => { s.classList.toggle('done', j < i); s.classList.toggle('active', j === i); }); bar.style.setProperty('--prog', String(Math.min(i / steps.length, 1))); };
    setStep(0); pl(() => setStep(1), 380); pl(() => setStep(2), 760);
    paras.forEach((p, i) => pl(() => { p.classList.add('scanned', 'scanning'); pl(() => p.classList.remove('scanning'), 160); }, 800 + i * 90));
    const end = 800 + paras.length * 90 + 120;
    pl(() => { setStep(3); head.classList.remove('analyzing'); head.classList.add('revealed'); paras.forEach(p => p.classList.remove('scanned')); Q.announce('اكتمل تحليل الحكم'); }, end);
    pl(() => { pipe.innerHTML = pipeDoneHTML(r); addNotice(r); }, end + 900);
  }

  function renderCard(r) {
    const [d, t] = counts(r);
    const fields = r.fields.map((f, idx) => fvHTML(r, f, idx, idx)).join('');
    const paras = r.paras.map((txt, i) => `<p class="para" id="${r.id}-p${i}" data-r="${r.id}" data-p="${i}"><span class="pnum num">${i + 1}</span>${txt}</p>`).join('');
    const rel = related(r).map(id => `<button data-open="${id}"><span>${R[id].title}</span><small>${R[id].no}/${R[id].year} · ${principlesOf(R[id]).find(p => principlesOf(r).includes(p))}</small></button>`).join('') || '<small style="color:var(--fg-3)">لا أحكام تشاركه مبدأً</small>';
    return `<div class="reader${seen.has(r.id) || Q.reduced() ? '' : ' analyzing'}" id="head">
      <article class="r-main" aria-label="نص الحكم">
        <button class="crumb" data-action="list">${svg(IC.back, 'ic-sm')} النتائج</button>
        <h1>${r.title}</h1>
        <div class="r-meta">${stamp(r, 'sm', true)}<span>${r.kind}</span><span>صدر <span class="num">${r.date}</span></span><span id="rc-badge">${badge(r)}</span></div>
        <div class="r-actions">
          <button class="btn btn-primary" data-action="review-all" id="review-all" ${d === t ? 'hidden' : ''}>${svg(IC.check, 'ic-sm')}راجعت الكل</button>
          <button class="btn" data-action="summarize">${svg(IC.sum, 'ic-sm')}لخّص</button>
          <button class="btn" data-action="compare">${svg(IC.compare, 'ic-sm')}قارن مع…</button>
          <button class="btn btn-ghost" data-action="assist">${svg(IC.msg, 'ic-sm')}اسأل عن هذا الحكم</button>
        </div>
        <div class="pipe" id="pipeline" aria-live="polite">${seen.has(r.id) ? pipeDoneHTML(r) : pipeStepsHTML(r)}</div>
        <section class="summary" id="summary" hidden aria-label="ملخّص مولَّد"></section>
        ${paras}
      </article>
      <aside class="r-aside">
        <div class="box"><h3>الخلاصة المستخرجة <span class="num" id="rc-count">${d} من ${t} مراجَع</span></h3><div class="meter" id="rc-pct" style="--pct:${t ? d / t : 0}"><i></i></div>${fields}</div>
        <div class="box"><h3>أحكام تشاركه المبدأ</h3><div class="related">${rel}</div></div>
      </aside>
    </div>`;
  }
  function renderList() {
    const pending = ORDER.filter(id => { const [d, t] = counts(R[id]); return d < t; }).length;
    const cards = ORDER.map(id => { const r = R[id]; const [d, t] = counts(r); const snip = r.paras[Math.max(r.paras.length - 2, 0)].slice(0, 180) + '…';
      return `<div class="card" tabindex="0" data-open="${id}" aria-label="افتح ${r.title}">
        <div class="c-top"><span>${r.kind}</span><span>·</span><span class="num">${r.date}</span><span>·</span><span>${r.circuit}</span></div>
        <div class="c-title">${r.title}</div>
        <div class="c-snip">${snip.replace('المقرر', '<mark>المقرر</mark>')}</div>
        <div class="c-tags">${principlesOf(r).map(p => `<span class="tag">${p}</span>`).join('')}<span class="tag">${g(r, 'winner') ? 'لصالح ' + g(r, 'winner') : g(r, 'disposition')}</span></div>
        <div class="c-side">${stamp(r, 'sm', true)}${badge(r)}<span class="num" style="font-size:11px;color:var(--fg-3)">${d}/${t} مراجَع</span></div>
      </div>`; }).join('');
    return `<div class="results" id="head">
      <aside class="facets" aria-label="المرشّحات">
        <div class="facet"><h3>الدائرة</h3><label><input type="checkbox" checked>إداري/2<span class="n">3</span></label><label><input type="checkbox" checked>تجاري/2<span class="n">1</span></label></div>
        <div class="facet"><h3>النوع</h3><label><input type="checkbox" checked>حكم<span class="n">3</span></label><label><input type="checkbox" checked>قرار غرفة مشورة<span class="n">1</span></label></div>
        <div class="facet"><h3>المبدأ</h3><label><input type="checkbox">لا حق مكتسب فيما صُرف بغير سند<span class="n">2</span></label><label><input type="checkbox">العبرة بمطابقة المؤهل<span class="n">2</span></label><label><input type="checkbox">رفض اليمين عند التعسف<span class="n">1</span></label></div>
        <div class="facet"><h3>المراجعة</h3><label><input type="checkbox">بانتظار المراجعة<span class="n">${pending}</span></label><label><input type="checkbox">مراجَع<span class="n">${ORDER.length - pending}</span></label></div>
        <div class="facet"><h3>السنة</h3><label><input type="checkbox" checked>2025<span class="n">4</span></label></div>
      </aside>
      <div>
        <div class="res-head"><h1>الأحكام</h1><span class="cnt"><span class="num">${ORDER.length}</span> نتائج</span><span class="sort">الترتيب: الأحدث</span></div>
        <div class="overview"><div class="ov-head">${svg(IC.info, 'ic-sm')}نظرة مولَّدة على النتائج — راجع الاستشهادات</div><p>أربعة أحكام من 2025، ثلاثة إدارية وواحد تجاري. يتكرر مبدآن: «لا حق مكتسب فيما صُرف بغير سند» في حكمين، و«العبرة بمطابقة المؤهل للنص» في حكمين — وانتهت الإدارية الثلاثة لصالح الإدارة. <span class="num">${pending}</span> منها لم تكتمل مراجعته بعد.</p></div>
        ${cards}
      </div>
    </div>`;
  }
  function shell() {
    const dark = document.documentElement.dataset.theme === 'dark';
    return `<div class="app" id="app">
      <header class="hdr">
        <div class="brand"><span class="brand-mark" aria-hidden="true">ق</span><span class="lbl">نظام القاضي</span></div>
        <form class="sbox" role="search" id="sform">${svg(IC.search)}<label class="sr-only" for="q">ابحث</label><input id="q" type="search" placeholder="ابحث بالموضوع، رقم الطعن، المادة، أو المبدأ…"><button type="submit" class="go">ابحث</button></form>
        <nav class="hnav" aria-label="التنقّل">${NAV.filter(([k]) => k !== 'search').map(([k, l]) => `<button data-action="nav" data-to="${k}" aria-label="${l}" ${k === 'rulings' ? 'aria-current="page"' : ''}>${svg(IC[k], 'ic-sm')} <span class="lbl">${l}</span></button>`).join('')}</nav>
        <button class="ib" data-action="assist" aria-label="المساعد">${svg(IC.msg)}</button>
        <button class="ib" data-action="theme" id="theme-btn" aria-label="${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}">${svg(dark ? IC.sun : IC.moon)}</button>
      </header>
      <main class="wrap" id="main">${S.view === 'card' ? renderCard(R[S.rid]) : renderList()}</main>
      <aside class="assist" id="assist" aria-label="المساعد">
        <div class="as-head">${svg(IC.msg)}المساعد<span class="as-ctx" id="as-ctx">${ctxText()}</span><button class="btn btn-ghost btn-icon" data-action="assist" aria-label="أغلق">${svg(IC.x)}</button></div>
        <div class="as-log" id="as-log" role="log">${assistEmptyHTML()}</div>
        <div class="as-tools"><button class="btn btn-secondary" data-action="draft">افحص مسودة</button></div>
        <form class="as-form" id="as-form"><label class="sr-only" for="as-input">اسأل</label><textarea id="as-input" rows="1" placeholder="اسأل عن أحكامك…"></textarea><button type="submit" class="btn btn-primary btn-icon" id="as-send" data-mode="send" aria-label="أرسل">${svg(IC.up)}</button></form>
      </aside>
    </div>`;
  }
  window.DESIGN = {
    key: 'muharrik', shell, renderCard, renderList,
    afterMount() { runPipeline(); },
    afterView() { runPipeline(); },
    onAction(act) { if (act !== 'replay') return false; seen.delete(S.rid); Q.setView('card', S.rid); return true; },
    beforeAsk() { $('#app')?.classList.add('assist-open'); },
    beforeCite() { if (matchMedia('(max-width: 900px)').matches) $('#app')?.classList.remove('assist-open'); },
    onTheme(dark) { const b = $('#theme-btn'); if (b) { b.innerHTML = svg(dark ? IC.sun : IC.moon); b.setAttribute('aria-label', dark ? 'الوضع الفاتح' : 'الوضع الداكن'); } }
  };
  document.addEventListener('submit', e => { if (e.target.id !== 'sform') return; e.preventDefault(); const v = $('#q').value.trim(); if (!v) return; const hit = ORDER.find(id => R[id].no === v || R[id].title.includes(v)); if (hit) Q.setView('card', hit); else { Q.setView('list'); Q.toast(`نتائج «${v}» — البحث الحقيقي على الخادم`); } });
  Q.initTheme(false);
  Q.mountAll();
})();
</script>
</body>
</html>
